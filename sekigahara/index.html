<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>関ヶ原立体絵図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* ── 関ヶ原立体絵図 ─ a single committed dark stage: a broadcast gallery at dawn ── */
:root{
  --sumi:#0E1014;        /* 墨 — ground */
  --sumi-2:#161A21;      /* panel */
  --sumi-3:#1E232C;      /* raised */
  --kiri:#D9DDD3;        /* 霧 — primary text */
  --kiri-dim:#98A096;    /* secondary text */
  --kiri-faint:#666E68;  /* tertiary */
  --shu:#D0453A;         /* 朱 — 西軍 */
  --shu-lo:#7A2822;
  --ai:#4F88C8;          /* 藍 — 東軍 */
  --ai-lo:#274A70;
  --kin:#CBA135;         /* 金 — 裏切り・問鉄砲 */
  --sen:#2A2F38;         /* hairline */
  --sen-lo:#1D222A;
  --disp:'Shippori Mincho B1', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
  --body:'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif;
  --data:'Barlow Condensed', 'Zen Kaku Gothic New', sans-serif;
  --bar-h:72px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--sumi); color:var(--kiri);
  font-family:var(--body); font-size:14px; line-height:1.7;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--kin);outline-offset:2px;border-radius:2px}

/* ── stage ── */
#stage{position:fixed;inset:0}
#gl{display:block;width:100%;height:100%}
#grade{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:
    radial-gradient(ellipse 120% 90% at 50% 42%, transparent 40%, rgba(6,7,10,.55) 100%),
    linear-gradient(to bottom, rgba(9,11,15,.68) 0%, rgba(9,11,15,.18) 22%, transparent 40%, rgba(8,9,12,.34) 74%, rgba(8,9,12,.86) 100%),
    linear-gradient(to right, rgba(9,11,15,.44) 0%, transparent 26%);
}

/* ── 3D-anchored labels ── */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;
  font-size:11px;letter-spacing:.06em;line-height:1.25;
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.7);
  will-change:transform,opacity}
.lb i{display:block;font-style:normal;font-family:var(--disp);font-weight:700;font-size:13px}
.lb b{display:block;font-family:var(--data);font-weight:500;font-size:11px;
  letter-spacing:.08em;font-variant-numeric:tabular-nums;opacity:.72}
.lb.e i{color:#BBD6F4} .lb.e{border-bottom:1px solid var(--ai)}
.lb.w i{color:#F2C3BC} .lb.w{border-bottom:1px solid var(--shu)}
.lb.g i{color:#F0DCA0} .lb.g{border-bottom:1px solid var(--kin)}
.lb.e,.lb.w,.lb.g{padding:0 5px 2px}
.lb.geo{border:0;padding:0}
.lb.geo i{font-size:12px;font-weight:500;color:#C4CBBF;letter-spacing:.22em;opacity:.85}
.lb.geo.rd i{font-size:10.5px;color:#B7A98A;letter-spacing:.3em;opacity:.72}
.lb.minor{opacity:.62}
.lb.minor i{font-size:11px;font-weight:500}

/* ── overlay chrome ── */
.ui{position:fixed;z-index:4}

/* slate */
#slate{top:26px;left:30px;pointer-events:none}
#slate h1{margin:0;font-family:var(--disp);font-weight:800;font-size:40px;line-height:1;
  letter-spacing:.16em;text-shadow:0 2px 20px rgba(0,0,0,.9)}
#slate .rule{width:64px;height:2px;background:var(--shu);margin:11px 0 9px}
#slate .meta{font-family:var(--data);font-size:14px;letter-spacing:.14em;color:var(--kiri-dim);
  font-variant-numeric:tabular-nums}
#slate .meta em{font-style:normal;font-family:var(--body);font-size:11.5px;letter-spacing:.18em;
  display:block;color:var(--kiri-faint);margin-top:2px}

/* vertical chapter title — a 軍記 title slip standing on the left edge */
#chap{top:198px;left:30px;pointer-events:none;width:120px;height:460px}
#chapTtl,#chapKick{position:absolute;top:0;display:flex;flex-direction:column;
  align-items:center;line-height:1}
#chapTtl{left:0;width:38px;gap:.16em;font-family:var(--disp);font-weight:700;font-size:29px;
  text-shadow:0 2px 18px rgba(0,0,0,.95);transition:color .5s}
#chapTtl .pt{height:.42em;transform:translate(.36em,-.30em)}
#chapRule{position:absolute;left:48px;top:2px;width:1px;height:104px;background:var(--sen)}
#chapKick{left:56px;width:16px;gap:.5em;font-size:11px;font-weight:500;color:var(--kiri-dim);
  text-shadow:0 1px 8px rgba(0,0,0,.9)}
#chap.turn #chapTtl{color:#EBD6A0}

/* right rail */
#rail{top:26px;right:30px;width:212px;display:flex;flex-direction:column;gap:14px}
.card{background:rgba(16,19,25,.78);border:1px solid var(--sen-lo);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);padding:13px 14px}
.card h2{margin:0 0 10px;font-size:10.5px;font-weight:500;letter-spacing:.34em;
  color:var(--kiri-faint)}
.force{display:flex;align-items:baseline;gap:9px;padding:5px 0}
.force+.force{border-top:1px solid var(--sen-lo)}
.force .sw{width:10px;height:10px;flex:none;transform:translateY(1px)}
.force .nm{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.1em}
.force .no{margin-left:auto;font-family:var(--data);font-size:15px;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;color:var(--kiri-dim)}
.force .no s{text-decoration:none;font-size:10px;color:var(--kiri-faint);margin-left:2px}
.e-sw{background:var(--ai)} .w-sw{background:var(--shu)}
.note{margin:9px 0 0;font-size:11px;line-height:1.6;color:var(--kiri-faint)}

.tg{display:flex;align-items:center;gap:9px;width:100%;padding:6px 0;text-align:left;
  font-size:12.5px;color:var(--kiri-dim);letter-spacing:.06em}
.tg+.tg{border-top:1px solid var(--sen-lo)}
.tg .box{width:26px;height:14px;flex:none;border:1px solid var(--sen);background:var(--sumi);
  position:relative;transition:background .18s,border-color .18s}
.tg .box::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;
  background:var(--kiri-faint);transition:transform .18s,background .18s}
.tg[aria-pressed="true"]{color:var(--kiri)}
.tg[aria-pressed="true"] .box{border-color:var(--ai-lo);background:rgba(79,136,200,.16)}
.tg[aria-pressed="true"] .box::after{transform:translateX(12px);background:var(--ai)}
.tg:hover{color:var(--kiri)}

/* narration — the lower third */
#narr{left:30px;bottom:calc(var(--bar-h) + 26px);width:min(520px,42vw);
  border-left:2px solid var(--shu);padding:2px 0 2px 16px;pointer-events:none}
#narr .clockline{font-family:var(--data);font-size:13px;letter-spacing:.2em;color:var(--kin);
  font-variant-numeric:tabular-nums;margin-bottom:5px}
#narr .clockline span{color:var(--kiri-faint);margin-left:10px;font-family:var(--body);
  font-size:11px;letter-spacing:.2em}
#narr p{margin:0;font-size:14.5px;line-height:1.85;color:var(--kiri);
  text-shadow:0 1px 10px rgba(0,0,0,.9)}
#narr.turn{border-left-color:var(--kin)}

/* transport bar */
#bar{left:0;right:0;bottom:0;height:var(--bar-h);
  background:linear-gradient(to top,rgba(9,11,15,.96),rgba(11,13,18,.82));
  border-top:1px solid var(--sen);display:flex;align-items:center;gap:20px;padding:0 30px}
#clock{font-family:var(--data);font-weight:600;font-size:30px;line-height:1;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;min-width:88px}
#koku{font-family:var(--disp);font-size:12px;letter-spacing:.3em;color:var(--kiri-faint);
  min-width:52px;margin-left:-12px}
.tbtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--sen);
  color:var(--kiri-dim);transition:border-color .15s,color .15s,background .15s}
.tbtn:hover{border-color:var(--ai-lo);color:var(--kiri);background:rgba(79,136,200,.1)}
.tbtn svg{width:13px;height:13px;fill:currentColor}
#speed{font-family:var(--data);font-size:14px;letter-spacing:.06em;color:var(--kiri-dim);
  border:1px solid var(--sen);height:32px;padding:0 11px;min-width:46px;
  font-variant-numeric:tabular-nums}
#speed:hover{border-color:var(--ai-lo);color:var(--kiri)}

#track{flex:1;position:relative;height:var(--bar-h);cursor:pointer;touch-action:none}
#trline{position:absolute;left:0;right:0;top:calc(50% + 5px);height:2px;background:var(--sen)}
#trfill{position:absolute;left:0;top:calc(50% + 5px);height:2px;background:var(--shu);width:0}
#trhead{position:absolute;top:calc(50% + 6px);width:1px;height:0;transform:translateX(-50%)}
#trhead::before{content:"";position:absolute;left:-4px;top:-4px;width:9px;height:9px;
  background:var(--kiri);box-shadow:0 0 0 3px rgba(208,69,58,.35)}
.mk{position:absolute;top:calc(50% + 5px);transform:translateX(-50%);padding:0;
  color:var(--kiri-faint);font-size:10.5px;letter-spacing:.14em;white-space:nowrap;
  transition:color .15s}
.mk::before{content:"";display:block;width:1px;height:9px;background:var(--sen);margin:0 auto 5px;
  transform:translateY(-14px)}
.mk span{display:block;transform:translateY(-14px)}
.mk:hover{color:var(--kiri)}
.mk.on{color:var(--shu)}
.mk.on::before{background:var(--shu);height:13px;transform:translateY(-18px)}

#hint{right:30px;bottom:calc(var(--bar-h) + 26px);font-size:11px;letter-spacing:.1em;
  color:var(--kiri-faint);text-align:right;pointer-events:none;transition:opacity .5s}
#hint kbd{font-family:var(--data);font-size:11.5px;border:1px solid var(--sen);padding:0 5px;
  margin:0 2px;color:var(--kiri-dim)}

@media (max-width:860px){
  #slate h1{font-size:30px} #chap{display:none} #rail{display:none} #hint{display:none}
  #narr{width:auto;right:24px;bottom:calc(var(--bar-h) + 18px)}
  #bar{gap:12px;padding:0 16px} #clock{font-size:24px;min-width:66px} #koku{display:none}
  .mk span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>
<div id="grade"></div>
<div id="labels"></div>

<header id="slate" class="ui">
  <h1>関ヶ原</h1>
  <div class="rule"></div>
  <div class="meta">1600.10.21<em>慶長五年九月十五日</em></div>
</header>

<div id="chap" class="ui">
  <div id="chapTtl">霧の盆地</div>
  <div id="chapRule"></div>
  <div id="chapKick">布陣</div>
</div>

<aside id="rail" class="ui">
  <section class="card">
    <h2>両軍</h2>
    <div class="force"><i class="sw e-sw"></i><span class="nm">東軍</span>
      <span class="no">74,000<s>騎</s></span></div>
    <div class="force"><i class="sw w-sw"></i><span class="nm">西軍</span>
      <span class="no">82,000<s>騎</s></span></div>
    <p class="note">西軍のうち実際に戦ったのは約三万五千。南宮山と松尾山の三万余は、ついに山を下りなかった。</p>
  </section>
  <section class="card">
    <h2>表示</h2>
    <button class="tg" id="tgFog"   aria-pressed="true"><i class="box"></i>霧</button>
    <button class="tg" id="tgArrow" aria-pressed="true"><i class="box"></i>進軍矢印</button>
    <button class="tg" id="tgUnit"  aria-pressed="true"><i class="box"></i>部隊名</button>
    <button class="tg" id="tgGeo"   aria-pressed="true"><i class="box"></i>地名</button>
    <button class="tg" id="tgCam"   aria-pressed="true"><i class="box"></i>自動カメラ</button>
  </section>
</aside>

<div id="narr" class="ui">
  <div class="clockline" id="narrClock">辰の刻<span>七時四十五分</span></div>
  <p id="narrText">濃霧が盆地を満たしている。</p>
</div>

<div id="hint" class="ui">
  ドラッグで視点移動・ホイールで寄る<br>
  <kbd>Space</kbd>再生 <kbd>←</kbd><kbd>→</kbd>章送り
</div>

<nav id="bar" class="ui" aria-label="再生操作">
  <div id="clock">07:45</div>
  <div id="koku">辰の刻</div>
  <button class="tbtn" id="btnPrev" aria-label="前の章"><svg viewBox="0 0 16 16"><path d="M4 2h2v12H4zM14 2v12L6 8z"/></svg></button>
  <button class="tbtn" id="btnPlay" aria-label="再生"><svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6z"/></svg></button>
  <button class="tbtn" id="btnNext" aria-label="次の章"><svg viewBox="0 0 16 16"><path d="M10 2h2v12h-2zM2 2l8 6-8 6z"/></svg></button>
  <button id="speed" aria-label="再生速度">×1.0</button>
  <div id="track" role="slider" aria-label="戦況時刻" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="trline"></div><div id="trfill"></div><div id="trhead"></div>
  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

/* =====================================================================
   1. 地形エンジン — analytic heightfield, coloured by elevation & slope
   ===================================================================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const smoother=t=>t*t*t*(t*(t*6-15)+10);
const smax=(a,b,k)=>{const h=Math.max(0,k-Math.abs(a-b))/k;return Math.max(a,b)+h*h*k*0.25;};

function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,oct){let s=0,amp=.5,f=1;for(let i=0;i<oct;i++){s+=amp*vnoise(x*f,y*f);f*=2.07;amp*=.5;}return s;}

const MPRE = MOUNTAINS.map(m=>{const r=m.r*Math.PI/180;return{...m,cs:Math.cos(r),sn:Math.sin(r)};});

function segDist(px,pz,ax,az,bx,bz){
  const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz;
  let t=l2?((px-ax)*dx+(pz-az)*dz)/l2:0; t=clamp(t,0,1);
  const cx=ax+dx*t-px,cz=az+dz*t-pz; return Math.sqrt(cx*cx+cz*cz);
}
function polyDist(x,z,pts){
  let d=1e9;
  for(let i=0;i<pts.length-1;i++) d=Math.min(d,segDist(x,z,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]));
  return d;
}

function baseH(x,z){
  let b=132;
  b-=sstep(700,3000,x)*64;      // 東へ ─ 垂井・大垣方面へ下る
  b+=sstep(-900,-3000,x)*74;    // 西へ ─ 今須の峠へ上る
  b+=sstep(700,2500,-z)*26;     // 北 ─ 伊吹の裾
  b+=sstep(1400,2900,z)*30;     // 南 ─ 尾根の裾
  return b;
}
function reliefAt(x,z){
  let r=0;
  for(let i=0;i<MPRE.length;i++){
    const m=MPRE[i], ox=x-m.x, oz=z-m.z;
    const dx=(ox*m.cs-oz*m.sn)/m.rx, dz=(ox*m.sn+oz*m.cs)/m.rz;
    const d2=dx*dx+dz*dz; if(d2>=1) continue;
    r=smax(r,(m.h-132)*Math.pow(1-d2,m.p),22);
  }
  return r;
}
/** 真の標高 (m) — 誇張前 */
function rawH(x,z){
  let h=baseH(x,z)+reliefAt(x,z);
  const rl=reliefAt(x,z);
  h+=(fbm(x*0.0016,z*0.0016,4)-0.5)*(9+rl*0.30);
  h+=(fbm(x*0.0068,z*0.0068,3)-0.5)*(3+rl*0.05);
  for(let i=0;i<RIVERS.length;i++){
    const rv=RIVERS[i], w=rv.w*5, d=polyDist(x,z,rv.pts);
    if(d<w){const k=1-d/w; h-=k*k*11;}
  }
  return h;
}

  for(let i=0;i<n;i++){
    const ix=i%W, iy=(i/W)|0, x=p.getX(i), z=p.getZ(i), h=hs[i];
    // 傾斜 — gradient read off the grid itself
    const gx=(hs[i+(ix<W-1?1:0)]-hs[i-(ix>0?1:0)])/(cell*((ix>0&&ix<W-1)?2:1));
    const gz=(hs[i+(iy<W-1?W:0)]-hs[i-(iy>0?W:0)])/(cell*((iy>0&&iy<W-1)?2:1));
    const slope=Math.sqrt(gx*gx+gz*gz);
    tmp.copy(C_PADDY).lerp(C_GRASS,sstep(128,172,h));
    const wood=clamp(sstep(0.13,0.31,slope)*0.96+sstep(165,255,h)*0.42,0,1);
    c2.copy(C_WOOD).lerp(C_DEEP,sstep(0.30,0.62,slope));
    tmp.lerp(c2,wood);
    tmp.lerp(C_ROCK,sstep(0.44,0.80,slope)*sstep(220,340,h));
    // 田の区画 — a faint patchwork where the plain is flat and low
    if(h<156&&slope<0.075){
      const q=Math.round(vnoise(x*0.0125,z*0.0125)*5)/5;
      tmp.offsetHSL(0,0.014*(q-0.5),0.055*(q-0.5));
    }
    const m=(fbm(x*0.011,z*0.011,3)-0.5)*0.055;
    tmp.offsetHSL(0,0,m);
    col[i*3]=tmp.r; col[i*3+1]=tmp.g; col[i*3+2]=tmp.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.computeVertexNormals();
  const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({
    vertexColors:true,roughness:0.96,metalness:0.0,flatShading:false}));
  mesh.receiveShadow=true; mesh.castShadow=true;

}

  const N=Math.max(24,pts.length*14), pos=[],uv=[],idx=[];

    const t=i/N, pt=cv.getPoint(t), tg=cv.getTangent(t);
    const nx=-tg.z, nz=tg.x, l=Math.hypot(nx,nz)||1;
    const w=width*0.5*(0.16+0.84*Math.min(1,Math.min(t,1-t)/0.055));
    for(let s=-1;s<=1;s+=2){

      pos.push(x,H(x,z)+lift,z); uv.push(t*12,(s+1)*0.5);
    }

  for(let i=0;i<N;i++){const a=i*2;idx.push(a,a+1,a+2, a+1,a+3,a+2);}

function mistTexture(){

  x.fillStyle='rgba(0,0,0,0)';x.fillRect(0,0,S,S);

    const px=rnd()*S,py=rnd()*S,r=26+rnd()*118,a=0.028+rnd()*0.055;
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
      const gx=px+ox*S,gy=py+oy*S;
      if(gx<-r||gx>S+r||gy<-r||gy>S+r)continue;
      const gr=x.createRadialGradient(gx,gy,0,gx,gy,r);
      gr.addColorStop(0,'rgba(255,255,255,'+a+')');

    }

       p.v.set((Math.random()-.5)*22,20+Math.random()*24,(Math.random()-.5)*22);}

}

/* =====================================================================
   7. カメラ — a keyframed crane, plus free orbit on demand
   ===================================================================== */
let TOTAL=0; CHAPTERS.forEach(c=>TOTAL+=c.dur);
{let acc=0; CHAPTERS.forEach(c=>{c.t0=acc/TOTAL; acc+=c.dur; c.t1=acc/TOTAL;});}
const KEYS=[];
CHAPTERS.forEach((c,ci)=>{
  c.cam.forEach((k,j)=>{
    if(ci>0&&j===0) return;                    // shared with previous chapter's tail
    KEYS.push({t:c.t0+(j/(c.cam.length-1))*(c.t1-c.t0),
      p:new THREE.Vector3(k[0],k[1],k[2]), g:new THREE.Vector3(k[3],k[4],k[5])});
  });
});
const cr=(a,b,c,d,u)=>{const u2=u*u,u3=u2*u;
  return 0.5*(2*b+(c-a)*u+(2*a-5*b+4*c-d)*u2+(-a+3*b-3*c+d)*u3);};
const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
function camAt(p){
  let i=0; while(i<KEYS.length-2&&KEYS[i+1].t<=p) i++;
  const k1=KEYS[i],k2=KEYS[i+1],k0=KEYS[Math.max(0,i-1)],k3=KEYS[Math.min(KEYS.length-1,i+2)];
  const u=clamp((p-k1.t)/Math.max(1e-6,k2.t-k1.t),0,1);
  camPos.set(cr(k0.p.x,k1.p.x,k2.p.x,k3.p.x,u),cr(k0.p.y,k1.p.y,k2.p.y,k3.p.y,u),cr(k0.p.z,k1.p.z,k2.p.z,k3.p.z,u));
  camTgt.set(cr(k0.g.x,k1.g.x,k2.g.x,k3.g.x,u),cr(k0.g.y,k1.g.y,k2.g.y,k3.g.y,u),cr(k0.g.z,k1.g.z,k2.g.z,k3.g.z,u));
}

/* 手動操作 — bespoke orbit, since the UMD build ships no controls */
const orb={tgt:new THREE.Vector3(-500,150,500),rad:4200,the:0.72,phi:0.86,
           drag:0,px:0,py:0,pan:false};
function applyOrbit(){
  const sp=Math.sin(orb.phi),cp=Math.cos(orb.phi);
  camera.position.set(orb.tgt.x+orb.rad*sp*Math.sin(orb.the),
                      orb.tgt.y+orb.rad*cp,
                      orb.tgt.z+orb.rad*sp*Math.cos(orb.the));
  camera.lookAt(orb.tgt);
}
function seedOrbit(){
  orb.tgt.copy(camTgt);
  const d=camera.position.clone().sub(orb.tgt);
  orb.rad=d.length(); orb.phi=Math.acos(clamp(d.y/orb.rad,-1,1)); orb.the=Math.atan2(d.x,d.z);
}
canvas.addEventListener('pointerdown',e=>{
  if(auto){auto=false;syncToggle(tgCam,false);seedOrbit();}
  orb.drag=1;orb.px=e.clientX;orb.py=e.clientY;orb.pan=e.shiftKey||e.button===2;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!orb.drag)return;
  const dx=e.clientX-orb.px,dy=e.clientY-orb.py; orb.px=e.clientX;orb.py=e.clientY;
  if(orb.pan){
    const f=orb.rad*0.0013;
    const rt=new THREE.Vector3(Math.cos(orb.the),0,-Math.sin(orb.the));
    const fw=new THREE.Vector3(-Math.sin(orb.the),0,-Math.cos(orb.the));
    orb.tgt.addScaledVector(rt,-dx*f).addScaledVector(fw,-dy*f);
  }else{
    orb.the-=dx*0.0042; orb.phi=clamp(orb.phi-dy*0.0034,0.10,1.44);
  }
});
addEventListener('pointerup',()=>orb.drag=0);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  if(auto){auto=false;syncToggle(tgCam,false);seedOrbit();}
  orb.rad=clamp(orb.rad*(1+Math.sign(e.deltaY)*0.10),300,9500);
},{passive:false});
</script>
<script>
"use strict";
/* =====================================================================
   8. 進行 — playback state, unit behaviour, labels, transport
   ===================================================================== */
let playing=!RM, P=0, speed=1, auto=true, ci=-1;
const NOFIGHT=new Set(['毛利秀元','吉川広家','安国寺恵瓊','長宗我部盛親','長束正家',
                       '池田輝政','浅野幸長','山内一豊','有馬豊氏']);
const GOLDC=new THREE.Color(COL.G);
UNITS.forEach(u=>{u._k=[[0,u.x,u.z]].concat(u.mv||[]); u._.side=u.a; u._.head=u._.g.rotation.y;});

function posAt(u,p){
  const k=u._k; let i=k.length-1;
  while(i>0&&k[i][0]>p) i--;
  if(i>=k.length-1) return [k[i][1],k[i][2],0];
  const a=k[i],b=k[i+1];
  const t=clamp((p-a[0])/Math.max(1e-6,b[0]-a[0]),0,1), e=smoother(t);
  const moving=t>0.001&&t<0.999?1:0;
  return [lerp(a[1],b[1],e),lerp(a[2],b[2],e),moving?Math.atan2(b[1]-a[1],b[2]-a[2]):0];
}

const hots=[]; let engTick=0;
function detectEngage(fire){
  hots.length=0;
  for(const u of UNITS) u._.eng=0;
  if(!fire) return;
  for(let i=0;i<UNITS.length;i++){
    const a=UNITS[i]; if(a._.alive<0.5||NOFIGHT.has(a.n)) continue;
    for(let j=i+1;j<UNITS.length;j++){
      const b=UNITS[j];
      if(b._.alive<0.5||NOFIGHT.has(b.n)||a._.side===b._.side) continue;
      const dx=a._.g.position.x-b._.g.position.x, dz=a._.g.position.z-b._.g.position.z;
      if(dx*dx+dz*dz<560*560){
        a._.eng=1; b._.eng=1;
        hots.push([(a._.g.position.x+b._.g.position.x)*.5,(a._.g.position.z+b._.g.position.z)*.5]);
      }
    }
  }
}
function writeMatrices(u,jit,sc){
  const st=u._;
  for(let i=0;i<st.n;i++){
    const s=st.seeds[i];
    const jx=jit?Math.sin(uTime.value*3.1+s.ph)*jit:0;
    const jz=jit?Math.cos(uTime.value*2.6+s.ph*1.7)*jit:0;
    T.set(s.x+jx,st.bh*.5*sc,s.z+jz);
    S.set(st.bw*lerp(0.4,1,sc),st.bh*sc,st.bh*1.5*lerp(0.4,1,sc));
    M.compose(T,Q.identity(),S);
    st.im.setMatrixAt(i,M);
  }
  st.im.instanceMatrix.needsUpdate=true;
}

/* ── labels ── */
const labelBox=document.getElementById('labels');
function mkLabel(cls,name,sub){
  const d=document.createElement('div'); d.className='lb '+cls;
  d.innerHTML='<i></i>'+(sub!==undefined?'<b></b>':'');
  d.firstChild.textContent=name;
  if(sub!==undefined) d.lastChild.textContent=sub;
  d.style.opacity='0'; labelBox.appendChild(d); return d;
}
UNITS.forEach(u=>{
  u._.el=mkLabel((u.a==='W'?'w':'e')+(u.maj?'':' minor'),u.n,u.s.toLocaleString('en-US'));
});
PLACES.forEach(pl=>{pl.el=mkLabel('geo'+(pl.rd?' rd':''),pl.n); pl.y=H(pl.x,pl.z);});

const NDC=new THREE.Vector3();
let EX=[];                       // screen regions the chrome already owns
function measureChrome(){
  EX=['slate','rail','narr','bar','hint'].map(id=>{
    const r=document.getElementById(id).getBoundingClientRect();
    return [r.left-(id==='rail'?96:16),r.top-10,r.right+16,r.bottom+10];
  });
}
const hidden=(px,py)=>{
  for(let i=0;i<EX.length;i++){const r=EX[i];
    if(px>r[0]&&px<r[2]&&py>r[1]&&py<r[3]) return true;}
  return false;
};
function place(el,x,y,z,vis,op){
  if(!vis){ if(el.style.opacity!=='0') el.style.opacity='0'; return; }
  NDC.set(x,y,z).project(camera);
  if(NDC.z>1||NDC.x<-0.97||NDC.x>0.97||NDC.y<-0.97||NDC.y>0.99){
    if(el.style.opacity!=='0') el.style.opacity='0'; return; }
  const px=(NDC.x*.5+.5)*innerWidth, py=(-NDC.y*.5+.5)*innerHeight;
  if(hidden(px,py)){ if(el.style.opacity!=='0') el.style.opacity='0'; return; }
  el.style.transform='translate('+px.toFixed(1)+'px,'+py.toFixed(1)+'px) translate(-50%,-100%)';
  el.style.opacity=op.toFixed(2);
}

/* ── transport ── */
const $=id=>document.getElementById(id);
const elClock=$('clock'),elKoku=$('koku'),elChapT=$('chapTtl'),elChapK=$('chapKick'),
      elNarr=$('narrText'),elNarrC=$('narrClock'),elFill=$('trfill'),elHead=$('trhead'),
      elTrack=$('track'),elChap=$('chap'),elNarrBox=$('narr'),elPlay=$('btnPlay'),elSpeed=$('speed');
const ICON_PLAY='<svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>';
CHAPTERS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='mk'; b.innerHTML='<span>'+c.kick+'</span>';
  b.style.left=(c.t0*100).toFixed(2)+'%';
  b.title=c.c0+' '+c.ttl;
  b.addEventListener('click',e=>{e.stopPropagation();P=c.t0+0.0005;});
  elTrack.appendChild(b); c.mk=b;
});
const mins=s=>{const a=s.split(':');return +a[0]*60+ +a[1];};
const K1=['〇','一','二','三','四','五','六','七','八','九'];
const kn=n=>n<10?K1[n]:(n>=20?K1[Math.floor(n/10)]:'')+'十'+(n%10?K1[n%10]:'');
const jpTime=m=>{const h=Math.floor(m/60),mm=m%60;
  return (h<12?'午前':'午後')+kn(h>12?h-12:h)+'時'+(mm?kn(mm)+'分':'');};
const koku=m=>m<540?'辰の刻':m<660?'巳の刻':m<780?'午の刻':'未の刻';

function vtext(el,str){
  el.textContent='';
  for(const ch of str){
    const sp=document.createElement('span');
    sp.textContent=ch;
    if('、。，・'.indexOf(ch)>=0) sp.className='pt';
    el.appendChild(sp);
  }
}
function setChapter(i){
  const c=CHAPTERS[i];
  vtext(elChapT,c.ttl); vtext(elChapK,c.kick); elNarr.textContent=c.nar;
  elChap.classList.toggle('turn',!!c.turn); elNarrBox.classList.toggle('turn',!!c.turn);
  CHAPTERS.forEach((d,j)=>d.mk.classList.toggle('on',j===i));
  elChapT.animate?elChapT.animate([{opacity:0,transform:'translateY(-14px)'},{opacity:1,transform:'none'}],
    {duration:RM?0:520,easing:'cubic-bezier(.2,.7,.3,1)'}):0;
  elNarr.animate?elNarr.animate([{opacity:0},{opacity:1}],{duration:RM?0:600}):0;
}
function syncToggle(b,v){b.setAttribute('aria-pressed',v?'true':'false');}
const tgFog=$('tgFog'),tgArrow=$('tgArrow'),tgUnit=$('tgUnit'),tgGeo=$('tgGeo'),tgCam=$('tgCam');
let showFog=true,showArrow=true,showUnit=true,showGeo=true;
tgFog.onclick  =()=>{showFog=!showFog;syncToggle(tgFog,showFog);};
tgArrow.onclick=()=>{showArrow=!showArrow;syncToggle(tgArrow,showArrow);arrowLayer.visible=showArrow;};
tgUnit.onclick =()=>{showUnit=!showUnit;syncToggle(tgUnit,showUnit);};
tgGeo.onclick  =()=>{showGeo=!showGeo;syncToggle(tgGeo,showGeo);};
tgCam.onclick  =()=>{auto=!auto;syncToggle(tgCam,auto);if(!auto)seedOrbit();};
function setPlay(v){playing=v;elPlay.innerHTML=v?ICON_PAUSE:ICON_PLAY;
  elPlay.setAttribute('aria-label',v?'一時停止':'再生');}
elPlay.onclick=()=>setPlay(!playing);
$('btnPrev').onclick=()=>{const c=CHAPTERS.findIndex(c=>P<c.t1);
  P=CHAPTERS[Math.max(0,(P-CHAPTERS[c].t0<0.012?c-1:c))].t0+0.0005;};
$('btnNext').onclick=()=>{const c=CHAPTERS.findIndex(c=>P<c.t1);
  P=c<CHAPTERS.length-1?CHAPTERS[c+1].t0+0.0005:0.9995;};
const SPEEDS=[0.5,1,1.5,2]; let si=1;
elSpeed.onclick=()=>{si=(si+1)%SPEEDS.length;speed=SPEEDS[si];elSpeed.textContent='×'+speed.toFixed(1);};
let scrub=0;
const setFromX=cx=>{const r=elTrack.getBoundingClientRect();P=clamp((cx-r.left)/r.width,0,0.9999);};
elTrack.addEventListener('pointerdown',e=>{if(e.target.classList.contains('mk'))return;
  scrub=1;setFromX(e.clientX);elTrack.setPointerCapture(e.pointerId);});
elTrack.addEventListener('pointermove',e=>{if(scrub)setFromX(e.clientX);});
addEventListener('pointerup',()=>scrub=0);
addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&e.key===' ')return;
  if(e.key===' '){e.preventDefault();setPlay(!playing);}
  else if(e.key==='ArrowRight'){e.preventDefault();$('btnNext').onclick();}
  else if(e.key==='ArrowLeft'){e.preventDefault();$('btnPrev').onclick();}
});
setPlay(playing);
setTimeout(()=>{const h=$('hint');if(h)h.style.opacity='0';},11000);

/* =====================================================================
   9. 描画 — the loop
   ===================================================================== */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false); measureChrome();
});
let last=performance.now(), emitAcc=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  uTime.value+=dt;
  if(playing&&!scrub){ P+=dt*speed/TOTAL; if(P>=1){P=0.99999;setPlay(false);} }

  /* 章 */
  let i=0; while(i<CHAPTERS.length-1&&P>=CHAPTERS[i].t1) i++;
  const c=CHAPTERS[i], cu=clamp((P-c.t0)/(c.t1-c.t0),0,1);
  if(i!==ci){ ci=i; setChapter(i); }
  const m0=mins(c.c0), m1=mins(c.c1), cm=Math.round(lerp(m0,m1,cu));
  const hh=String(Math.floor(cm/60)).padStart(2,'0'), mm=String(cm%60).padStart(2,'0');
  if(elClock.textContent!==hh+':'+mm){
    elClock.textContent=hh+':'+mm; elKoku.textContent=koku(cm);
    elNarrC.innerHTML=koku(cm)+'<span>'+jpTime(cm)+'</span>';
  }
  elFill.style.width=(P*100).toFixed(3)+'%'; elHead.style.left=(P*100).toFixed(3)+'%';
  elTrack.setAttribute('aria-valuenow',Math.round(P*100));
  elTrack.setAttribute('aria-valuetext',hh+':'+mm+' '+c.ttl);

  /* 光と霧 */
  const dayK=clamp((cm-465)/(870-465),0,1);
  setSun(dayK);
  const nx=CHAPTERS[Math.min(i+1,CHAPTERS.length-1)];
  const fogK=lerp(c.fog,nx.fog,smoother(cu));
  scene.fog.density=0.000105+fogK*0.000092;
  scene.fog.color.copy(skyU.uMid.value).lerp(new THREE.Color(0xd6dcd8),0.35*fogK);
  mistLayer.visible=showFog;
  MIST.forEach(L=>{
    L.tex.offset.x+=L.sp[0]*dt; L.tex.offset.y+=L.sp[1]*dt;
    L.mesh.material.opacity=0.44*fogK*L.o;
  });

  /* 部隊 */
  const fire=!!c.fire||i===CHAPTERS.length-1;
  if((engTick=(engTick+1)%6)===0) detectEngage(fire);
  for(const u of UNITS){
    const st=u._, pr=posAt(u,P), y=H(pr[0],pr[1]);
    st.g.position.set(pr[0],y,pr[1]);
    const head=pr[2];
    if(head){ let d=head-st.g.rotation.y;
      while(d>Math.PI)d-=6.2832; while(d<-Math.PI)d+=6.2832;
      st.g.rotation.y+=d*Math.min(1,dt*1.6); }
    const alive=u.fx?1-sstep(u.fx,u.fx+0.03,P):1;
    const gold=u.turn?sstep(u.turn,u.turn+0.02,P):0;
    if(gold>0.5&&!st.gold){st.gold=1;st.side='E';
      st.flag.material.map=noboriTex(u,true);st.flag.material.needsUpdate=true;}
    st.cur.copy(st.base).lerp(GOLDC,gold);
    st.im.material.color.copy(st.cur);
    st.disc.material.color.copy(st.cur);
    st.disc.material.opacity=0.13*alive;
    st.flag.material.opacity=alive;
    st.flag.visible=alive>0.05;
    st.g.visible=alive>0.02;
    const wasAlive=st.alive; st.alive=alive;
    if(st.eng||alive<0.999||wasAlive!==alive) writeMatrices(u,st.eng?7:0,Math.max(0.001,alive));
    st.im.castShadow=alive>0.5;
    /* label */
    const dcam=camera.position.distanceTo(st.g.position);
    const vis=showUnit&&alive>0.25&&(u.maj||dcam<2200);
    place(st.el,st.g.position.x,y+(u.maj?150:120),st.g.position.z,vis,
      alive*(u.maj?1:clamp((2200-dcam)/600,0,1)));
    if(st.gold) st.el.className='lb g'+(u.maj?'':' minor');
  }
  for(const pl of PLACES){
    const dcam=camera.position.distanceTo(T.set(pl.x,pl.y,pl.z));
    place(pl.el,pl.x,pl.y+(pl.flat||pl.rd?40:70),pl.z,showGeo&&dcam<7200,
      clamp((7200-dcam)/2200,0,1)*0.95);
  }

  /* 硝煙 */
  if(fire&&hots.length){
    emitAcc+=dt*Math.min(26,6+hots.length*2.4);
    while(emitAcc>1){ emitAcc-=1;
      const h=hots[(Math.random()*hots.length)|0];
      emit(h[0],h[1],Math.random()<0.42); }
  }
  stepFX(dt);

  /* 矢印 */
  ARROWS.forEach(a=>{
    const ch=CHAPTERS[a.c], u=(P-ch.t0)/(ch.t1-ch.t0);
    const prog=clamp((u-(a.d||0))/0.40,0,1);
    const op=(u<0?0:1)*(1-sstep(ch.t1-0.004,ch.t1+0.016,P));
    a._m.material.uniforms.uProg.value=prog;
    a._m.material.uniforms.uOp.value=op;
    a._m.visible=op>0.01&&prog>0;
    if(a._out){a._out.material.uniforms.uProg.value=prog;
      a._out.material.uniforms.uOp.value=op;a._out.visible=a._m.visible;}
    if(a.stop) noFight.userData.mat.opacity=op*prog*0.9;
  });
  noFight.visible=noFight.userData.mat.opacity>0.02&&showArrow;

  /* カメラ */
  if(auto){
    camAt(P);
    if(!RM){
      const t=uTime.value;
      camPos.x+=Math.sin(t*0.29)*9; camPos.y+=Math.sin(t*0.21+1.3)*6; camPos.z+=Math.cos(t*0.24)*9;
      camTgt.x+=Math.sin(t*0.19+2.1)*5; camTgt.z+=Math.cos(t*0.17)*5;
    }
    camera.position.lerp(camPos,1-Math.pow(0.0015,dt));
    T.copy(camTgt); camera.lookAt(T);
  }else applyOrbit();
  sky.position.copy(camera.position);

  renderer.render(scene,camera);
}
camAt(0); camera.position.copy(camPos); camera.lookAt(camTgt); setSun(0);
setChapter(0); ci=0; measureChrome();
requestAnimationFrame(frame);
</script>
