<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>接客力向上トレーニング</title>
    <!-- 通信の高速化: バックエンド(Google Apps Script)への接続を事前に確立しておく。
         Apps ScriptのWebアプリは script.google.com から script.googleusercontent.com へ
         リダイレクトされるため、両方に対して事前接続しておくことで実際の通信時の
         待ち時間を短縮する。 -->
    <link rel="preconnect" href="https://script.google.com" />
    <link rel="preconnect" href="https://script.googleusercontent.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
