<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMURAI BLUE PK CHALLENGE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #003087;
  --blue2: #0050c8;
  --gold: #f5c842;
  --gold2: #e8a000;
  --red: #e8003c;
  --white: #ffffff;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Noto Sans JP', sans-serif;
  background: #000;
  color: #fff;
  user-select: none;
}

/* ===== STADIUM BG ===== */
#bg {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse 120% 60% at 50% 110%, #1a3a6b 0%, #05101f 60%, #000 100%);
}
#bg::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg, transparent 0, transparent 58px, rgba(255,255,255,0.02) 58px, rgba(255,255,255,0.02) 60px),
    repeating-linear-gradient(0deg, transparent 0, transparent 58px, rgba(255,255,255,0.02) 58px, rgba(255,255,255,0.02) 60px);
}
#bg::after {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 35% 25% at 8% 0%, rgba(200,220,255,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 35% 25% at 92% 0%, rgba(200,220,255,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 50% 0%, rgba(200,220,255,0.06) 0%, transparent 70%);
}

/* ===== CROWD ===== */
#crowd {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 1;
  height: 16vh;
  pointer-events: none;
}
#crowd svg { width: 100%; height: 100%; }

/* ===== PARTICLE CANVAS ===== */
#particles { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

/* ===== FLASH ===== */
#flash {
  position: fixed; inset: 0; z-index: 200;
  background: white; opacity: 0; pointer-events: none;
  transition: opacity 0.08s;
}

/* ===== SCREENS ===== */
.screen {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease;
}
.screen.active { opacity: 1; pointer-events: all; }

/* ===== TITLE ===== */
#screen-title { gap: 2vh; }

.title-emblem {
  width: clamp(60px, 10vw, 100px);
  height: clamp(60px, 10vw, 100px);
  margin-bottom: 1vh;
  animation: emblemSpin 6s linear infinite;
  filter: drop-shadow(0 0 20px rgba(245,200,66,0.8));
}

.title-badge {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(12px, 1.8vw, 18px);
  letter-spacing: 0.5em;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(245,200,66,0.6);
}

.title-main {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(50px, 10vw, 120px);
  line-height: 0.85;
  text-align: center;
  background: linear-gradient(180deg, #fff 0%, #7ab0ff 40%, #003087 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 30px rgba(0,80,200,0.8));
  animation: titlePulse 3s ease-in-out infinite;
}

.title-red {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(18px, 3vw, 36px);
  letter-spacing: 0.3em;
  color: var(--red);
  text-shadow: 0 0 20px rgba(232,0,60,0.8);
}

.tap-start {
  margin-top: 3vh;
  padding: clamp(14px,2vh,22px) clamp(50px,8vw,90px);
  font-size: clamp(15px, 2.2vw, 24px);
  font-weight: 900; letter-spacing: 0.25em;
  color: #fff;
  background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
  border: 2px solid rgba(120,160,255,0.5);
  border-radius: 50px; cursor: pointer;
  box-shadow: 0 0 30px rgba(0,80,200,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
  animation: tapBlink 1.6s ease-in-out infinite;
  transition: all 0.3s;
}
.tap-start:hover {
  transform: scale(1.06);
  box-shadow: 0 0 50px rgba(0,80,200,0.8), inset 0 1px 0 rgba(255,255,255,0.3);
}

/* ===== PLAY SCREEN ===== */
#screen-play { gap: 0; }

.play-header {
  text-align: center; margin-bottom: 2vh;
}
.play-header h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(22px, 3.5vw, 44px);
  letter-spacing: 0.2em; color: var(--gold);
  text-shadow: 0 0 20px rgba(245,200,66,0.6);
}
.play-header p {
  font-size: clamp(10px, 1.4vw, 14px);
  color: rgba(255,255,255,0.55); letter-spacing: 0.15em;
  margin-top: 4px;
}

/* Goal wrap */
.goal-wrap {
  position: relative;
  width: min(82vw, 720px);
  aspect-ratio: 7/4.5;
}

.goal-frame {
  position: absolute; inset: 0;
  border: 5px solid rgba(255,255,255,0.92);
  border-bottom: none; border-radius: 4px 4px 0 0;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.15), 0 0 50px rgba(255,255,255,0.08), inset 0 0 80px rgba(0,0,30,0.5);
  background: linear-gradient(180deg, rgba(0,20,60,0.4) 0%, rgba(0,40,10,0.2) 100%);
}
.goal-frame::before {
  content: ''; position: absolute; top: -7px; left: -7px; right: -7px; height: 14px;
  background: linear-gradient(to bottom, #e8e8e8, #aaa);
  border-radius: 4px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.6);
}
.goal-frame::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: -8px; right: -8px;
  border-left: 14px solid rgba(200,200,200,0.85);
  border-right: 14px solid rgba(200,200,200,0.85);
  pointer-events: none;
}

.goal-net {
  position: absolute; inset: 5px 5px 0;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.07) 0, rgba(255,255,255,0.07) 1px, transparent 1px, transparent 30px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.07) 0, rgba(255,255,255,0.07) 1px, transparent 1px, transparent 30px);
  pointer-events: none;
}

/* GK */
#gk {
  position: absolute; bottom: 6%; left: 50%;
  transform: translateX(-50%);
  width: 13%; aspect-ratio: 0.55/1;
  pointer-events: none; z-index: 3;
}

/* Ball */
#ball {
  position: absolute; width: 6%; aspect-ratio: 1;
  bottom: 1%; left: 50%;
  transform: translateX(-50%);
  pointer-events: none; z-index: 4; opacity: 0;
}

/* 9 zones */
.goal-grid {
  position: absolute; inset: 5px 12px 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 3px; z-index: 5;
}
.zone {
  position: relative; cursor: pointer; border-radius: 2px;
  overflow: hidden;
  transition: background 0.2s;
}
.zone::before {
  content: ''; position: absolute; inset: 0;
  background: transparent; transition: all 0.2s; border-radius: 2px;
}
.zone:hover::before {
  background: rgba(245,200,66,0.22);
  box-shadow: inset 0 0 25px rgba(245,200,66,0.25);
}
.zone-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(7px, 1vw, 12px); font-weight: 700;
  color: rgba(255,255,255,0); transition: color 0.2s;
  letter-spacing: 0.05em;
}
.zone:hover .zone-label { color: rgba(255,255,255,0.75); }

/* ===== CUT-IN OVERLAY ===== */
#cutin {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; overflow: hidden;
  opacity: 0;
}
#cutin.active { opacity: 1; }

/* Speed lines */
.speedlines {
  position: absolute; inset: -50%;
  width: 200%; height: 200%;
  pointer-events: none;
}

/* Cut-in panels */
.cutin-panels {
  position: absolute; inset: 0;
  display: flex;
}
.panel-left {
  flex: 1;
  clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
  position: relative; overflow: hidden;
}
.panel-right {
  flex: 1;
  clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
  position: relative; overflow: hidden;
}

/* Character art container */
.char-art {
  position: absolute; inset: 0;
  display: flex; align-items: flex-end; justify-content: center;
  overflow: hidden;
}
.char-art svg { height: 90%; width: auto; }

/* Cut-in text */
.cutin-text {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  text-align: center; z-index: 10;
  white-space: nowrap;
}
.cutin-text .line1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(30px, 6vw, 80px);
  letter-spacing: 0.15em;
  display: block;
  text-shadow: 0 0 40px currentColor, 3px 3px 0 rgba(0,0,0,0.5);
}
.cutin-text .line2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(50px, 10vw, 130px);
  letter-spacing: 0.08em;
  display: block;
  text-shadow: 0 0 60px currentColor, 4px 4px 0 rgba(0,0,0,0.5);
  line-height: 0.9;
}

/* SUPER SHOT style */
.cutin-super .panel-left { background: linear-gradient(135deg, #001a5e, #003087); }
.cutin-super .panel-right { background: linear-gradient(225deg, #001a5e, #003087); }
.cutin-super .line1 { color: var(--gold); }
.cutin-super .line2 { color: #fff; filter: drop-shadow(0 0 20px #7ab0ff); }

/* NORMAL SHOT style */
.cutin-normal .panel-left { background: linear-gradient(135deg, #001530, #002560); }
.cutin-normal .panel-right { background: linear-gradient(225deg, #001530, #002560); }
.cutin-normal .line1 { color: rgba(255,255,255,0.7); }
.cutin-normal .line2 { color: var(--gold); }

/* KEEPER style */
.cutin-keeper .panel-left { background: linear-gradient(135deg, #1a0000, #500010); }
.cutin-keeper .panel-right { background: linear-gradient(225deg, #1a0000, #500010); }
.cutin-keeper .line1 { color: rgba(255,200,200,0.9); }
.cutin-keeper .line2 { color: #ff4466; filter: drop-shadow(0 0 20px #ff4466); }

/* ===== RESULT SCREEN ===== */
#screen-result { gap: 2vh; padding: 2vh; }

.result-badge {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(65px, 14vw, 170px);
  line-height: 1; text-align: center;
  animation: resultPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
}
.result-badge.goal {
  background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, #ff8800 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 35px rgba(255,150,0,0.9));
}
.result-badge.supergoal {
  background: linear-gradient(135deg, var(--gold) 0%, #fff 40%, var(--gold) 80%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 50px rgba(245,200,66,1));
  animation: resultPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both, superPulse 0.8s 0.5s ease-in-out infinite alternate;
}
.result-badge.save {
  background: linear-gradient(135deg, #888 0%, #fff 50%, #888 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(255,255,255,0.4));
}

.super-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(18px, 3vw, 36px);
  letter-spacing: 0.4em;
  color: var(--gold);
  text-shadow: 0 0 30px rgba(245,200,66,0.8);
  animation: cardSlide 0.4s 0.1s both;
  display: none;
}
.super-label.show { display: block; }

.fortune-card {
  width: min(92vw, 620px);
  background: linear-gradient(135deg, rgba(0,10,30,0.96) 0%, rgba(0,30,70,0.96) 100%);
  border: 1px solid rgba(120,160,255,0.35);
  border-radius: 20px;
  padding: clamp(18px,3vw,38px);
  text-align: center;
  box-shadow: 0 0 60px rgba(0,80,200,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
  animation: cardSlide 0.6s 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  position: relative; overflow: hidden;
}
.fortune-card::before {
  content: ''; position: absolute; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent 0deg, rgba(0,80,200,0.06) 60deg, transparent 120deg);
  animation: spin 10s linear infinite;
}

.fortune-icon { font-size: clamp(28px,4.5vw,52px); margin-bottom: 1vh; animation: iconBounce 0.8s 0.8s ease both; }
.fortune-theme { font-size: clamp(9px,1.3vw,13px); letter-spacing: 0.35em; color: var(--gold); margin-bottom: 0.8vh; }
.fortune-title {
  font-size: clamp(20px,3.2vw,40px); font-weight: 900; margin-bottom: 1.2vh; line-height: 1.2;
  background: linear-gradient(135deg, #fff 0%, #7ab0ff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.fortune-text { font-size: clamp(12px,1.6vw,17px); line-height: 1.85; color: rgba(255,255,255,0.85); }
.course-tag {
  display: inline-block; margin-top: 1.5vh;
  padding: 5px 18px;
  border: 1px solid rgba(120,160,255,0.4); border-radius: 20px;
  font-size: clamp(9px,1.1vw,12px); color: rgba(120,160,255,0.85); letter-spacing: 0.1em;
}

.replay-btn {
  margin-top: 2vh;
  padding: clamp(12px,1.8vh,20px) clamp(40px,7vw,75px);
  font-size: clamp(14px,1.9vw,20px); font-weight: 900; letter-spacing: 0.2em;
  color: #fff;
  background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
  border: none; border-radius: 50px; cursor: pointer;
  box-shadow: 0 8px 30px rgba(0,80,200,0.5);
  transition: all 0.3s;
  animation: cardSlide 0.5s 0.6s both;
}
.replay-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 40px rgba(0,80,200,0.8); }

/* ===== ANIMATIONS ===== */
@keyframes emblemSpin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
@keyframes titlePulse { 0%,100%{filter:drop-shadow(0 0 20px rgba(0,80,200,0.6))} 50%{filter:drop-shadow(0 0 50px rgba(0,80,200,1))} }
@keyframes tapBlink { 0%,100%{opacity:1} 50%{opacity:0.5} }
@keyframes resultPop { 0%{transform:scale(0.2) rotate(-8deg);opacity:0} 100%{transform:scale(1) rotate(0);opacity:1} }
@keyframes superPulse { 0%{filter:drop-shadow(0 0 30px rgba(245,200,66,0.8))} 100%{filter:drop-shadow(0 0 70px rgba(245,200,66,1))} }
@keyframes cardSlide { 0%{transform:translateY(40px);opacity:0} 100%{transform:translateY(0);opacity:1} }
@keyframes iconBounce { 0%{transform:scale(0)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }
@keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }

/* Cut-in anims */
@keyframes cutinEnter {
  0%   { opacity:0; transform:scaleX(0.05); }
  30%  { opacity:1; transform:scaleX(1.04); }
  50%  { transform:scaleX(0.98); }
  100% { opacity:1; transform:scaleX(1); }
}
@keyframes cutinExit {
  0%   { opacity:1; transform:scaleX(1); }
  100% { opacity:0; transform:scaleX(1.08); }
}
@keyframes panelSlideLeft {
  0%  { transform:translateX(-120%); }
  60% { transform:translateX(4%); }
  100%{ transform:translateX(0); }
}
@keyframes panelSlideRight {
  0%  { transform:translateX(120%); }
  60% { transform:translateX(-4%); }
  100%{ transform:translateX(0); }
}
@keyframes cutinText {
  0%  { transform:translate(-50%,-50%) scale(2.5); opacity:0; }
  40% { transform:translate(-50%,-50%) scale(0.95); opacity:1; }
  100%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
}
@keyframes speedLine {
  0%  { transform:rotate(var(--r)) scaleX(0); opacity:0.8; }
  50% { transform:rotate(var(--r)) scaleX(1); opacity:0.6; }
  100%{ transform:rotate(var(--r)) scaleX(1.5); opacity:0; }
}
@keyframes charSlideIn {
  0%  { transform:translateX(var(--slide)) scale(0.85); opacity:0; }
  70% { transform:translateX(0) scale(1.03); opacity:1; }
  100%{ transform:translateX(0) scale(1); opacity:1; }
}
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="particles"></canvas>
<div id="flash"></div>

<!-- Crowd -->
<div id="crowd">
  <svg viewBox="0 0 1400 140" preserveAspectRatio="none">
    <defs>
      <linearGradient id="crowdFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.95)"/>
      </linearGradient>
    </defs>
    <path d="M0,90 Q35,65 70,82 Q105,100 140,72 Q175,44 210,78 Q245,108 280,68 Q315,32 350,72 Q385,108 420,70 Q455,36 490,75 Q525,110 560,72 Q595,38 630,75 Q665,108 700,68 Q735,32 770,75 Q805,110 840,72 Q875,38 910,78 Q945,110 980,72 Q1015,38 1050,78 Q1085,110 1120,72 Q1155,38 1190,78 Q1225,110 1260,75 Q1295,42 1330,80 Q1365,110 1400,88 L1400,140 L0,140 Z" fill="#0a0a1a"/>
    <g fill="rgba(0,48,135,0.6)">
      <circle cx="70" cy="76" r="6"/><circle cx="140" cy="66" r="7"/><circle cx="210" cy="72" r="6"/>
      <circle cx="280" cy="62" r="7"/><circle cx="350" cy="66" r="6"/><circle cx="420" cy="64" r="7"/>
      <circle cx="490" cy="69" r="6"/><circle cx="560" cy="66" r="7"/><circle cx="630" cy="69" r="6"/>
      <circle cx="700" cy="62" r="7"/><circle cx="770" cy="69" r="6"/><circle cx="840" cy="66" r="7"/>
      <circle cx="910" cy="72" r="6"/><circle cx="980" cy="66" r="7"/><circle cx="1050" cy="72" r="6"/>
      <circle cx="1120" cy="66" r="7"/><circle cx="1190" cy="72" r="6"/><circle cx="1260" cy="69" r="7"/>
      <circle cx="1330" cy="74" r="6"/>
    </g>
    <!-- Japan flags tiny -->
    <g opacity="0.4">
      <rect x="60" y="58" width="12" height="8" fill="white"/><circle cx="66" cy="62" r="2.5" fill="#BC002D"/>
      <rect x="270" y="50" width="12" height="8" fill="white"/><circle cx="276" cy="54" r="2.5" fill="#BC002D"/>
      <rect x="550" y="54" width="12" height="8" fill="white"/><circle cx="556" cy="58" r="2.5" fill="#BC002D"/>
      <rect x="840" y="52" width="12" height="8" fill="white"/><circle cx="846" cy="56" r="2.5" fill="#BC002D"/>
      <rect x="1120" y="54" width="12" height="8" fill="white"/><circle cx="1126" cy="58" r="2.5" fill="#BC002D"/>
    </g>
    <rect x="0" y="0" width="1400" height="140" fill="url(#crowdFade)"/>
  </svg>
</div>

<!-- CUT-IN OVERLAY -->
<div id="cutin">
  <canvas id="speedCanvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;"></canvas>
  <div class="cutin-panels" id="cutinPanels">
    <div class="panel-left" id="panelLeft">
      <div class="char-art" id="charLeft"></div>
    </div>
    <div class="panel-right" id="panelRight">
      <div class="char-art" id="charRight"></div>
    </div>
  </div>
  <div class="cutin-text" id="cutinText">
    <span class="line1" id="cutinLine1"></span>
    <span class="line2" id="cutinLine2"></span>
  </div>
</div>

<!-- TITLE SCREEN -->
<div id="screen-title" class="screen active">
  <svg class="title-emblem" viewBox="0 0 100 100">
    <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35" fill="none" stroke="#f5c842" stroke-width="3"/>
    <circle cx="50" cy="50" r="20" fill="none" stroke="#003087" stroke-width="6"/>
    <text x="50" y="57" text-anchor="middle" font-size="22" fill="#fff" font-family="serif">⚽</text>
  </svg>
  <div class="title-badge">SAMURAI BLUE PRESENTS</div>
  <div class="title-main">PK<br>CHALLENGE</div>
  <div class="title-red">JAPAN NATIONAL TEAM</div>
  <button class="tap-start" onclick="startGame()">⚽ TAP TO START</button>
</div>

<!-- PLAY SCREEN -->
<div id="screen-play" class="screen">
  <div class="play-header">
    <h2>コースを選べ！</h2>
    <p>9つのゾーンから狙いを定めよ — SAMURAI BLUE</p>
  </div>
  <div class="goal-wrap" id="goalWrap">
    <div class="goal-frame">
      <div class="goal-net"></div>
      <!-- GK (Japan GK: blue gloves, orange jersey) -->
      <div id="gk">
        <svg viewBox="0 0 70 130" xmlns="http://www.w3.org/2000/svg">
          <!-- Body: orange GK jersey -->
          <rect x="16" y="48" width="38" height="48" rx="7" fill="#FF6B00"/>
          <rect x="22" y="48" width="26" height="8" fill="#cc5500"/>
          <!-- Number -->
          <text x="35" y="80" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.8)" font-family="Bebas Neue,sans-serif">1</text>

// ===== PARTICLES =====
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor(x,y,type){
    this.x=x; this.y=y; this.type=type;
    if(type==='goal'||type==='super'){
      const power = type==='super'?2:1;
      this.vx=(Math.random()-0.5)*20*power;
      this.vy=(Math.random()-0.5)*20*power-10*power;
      this.size=Math.random()*12*power+4;
      this.color=type==='super'
        ?['#f5c842','#fff','#ffcc00','#ffe566','#ff8800'][Math.floor(Math.random()*5)]
        :['#f5c842','#ff6600','#fff','#ff4444','#44ffaa'][Math.floor(Math.random()*5)];
      this.life=1; this.decay=Math.random()*0.012+0.008;
      this.gravity=0.35; this.shape=Math.random()>0.5?'circle':'rect';
      this.rotation=Math.random()*Math.PI*2; this.rotSpeed=(Math.random()-0.5)*0.25;
    } else {
      this.vx=(Math.random()-0.5)*0.4; this.vy=-Math.random()*0.4-0.1;
      this.size=Math.random()*1.5+0.5;
      this.color=`rgba(0,80,200,${Math.random()*0.2+0.05})`;
      this.life=1; this.decay=Math.random()*0.002+0.001;
    }
  }
  update(){
    this.x+=this.vx; this.y+=this.vy;
    if(this.type==='goal'||this.type==='super'){ this.vy+=this.gravity; this.vx*=0.98; this.rotation+=this.rotSpeed; }
    this.life-=this.decay;
  }
  draw(){
    ctx.save(); ctx.globalAlpha=Math.max(0,this.life);
    if(this.type==='goal'||this.type==='super'){
      ctx.translate(this.x,this.y); ctx.rotate(this.rotation); ctx.fillStyle=this.color;
      if(this.shape==='circle'){ ctx.beginPath(); ctx.arc(0,0,this.size,0,Math.PI*2); ctx.fill(); }
      else { ctx.fillRect(-this.size/2,-this.size/2,this.size,this.size*0.55); }
    } else {
      ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function burst(x,y,type='goal'){
  const count = type==='super'?200:120;
  for(let i=0;i<count;i++) particles.push(new Particle(x,y,type));
}

function animParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(Math.random()<0.2) particles.push(new Particle(Math.random()*canvas.width,canvas.height+5,'ambient'));
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(animParticles);
}
animParticles();

const speedCanvas = document.getElementById('speedCanvas');
const sCtx = speedCanvas.getContext('2d');
function resizeSpeed(){ speedCanvas.width=innerWidth; speedCanvas.height=innerHeight; }

function drawSpeedLines(color='rgba(255,220,0,0.25)'){
  sCtx.clearRect(0,0,speedCanvas.width,speedCanvas.height);
  const cx=speedCanvas.width/2, cy=speedCanvas.height/2;
  const n=80;
  for(let i=0;i<n;i++){
    const angle=(i/n)*Math.PI*2;
    const inner=Math.random()*80+60;
    const outer=Math.random()*600+300;
    const width=Math.random()*3+0.5;
    sCtx.beginPath();
    sCtx.moveTo(cx+Math.cos(angle)*inner, cy+Math.sin(angle)*inner);
    sCtx.lineTo(cx+Math.cos(angle)*outer, cy+Math.sin(angle)*outer);
    sCtx.strokeStyle=color;
    sCtx.lineWidth=width;
    sCtx.stroke();
  }
}

    <rect x="57" y="178" width="22" height="28" rx="3" fill="white"/>
    <ellipse cx="42" cy="210" rx="15" ry="6" fill="#111"/>
    <ellipse cx="68" cy="210" rx="15" ry="6" fill="#111"/>
    <!-- Sweat drop -->
    <path d="M80,42 Q83,36 86,42 Q83,48 80,42Z" fill="rgba(100,200,255,0.8)"/>
  </svg>`;
}

// ===== CUT-IN ENGINE =====
function showCutin(type, onDone){
  const overlay = document.getElementById('cutin');
  const panels  = document.getElementById('cutinPanels');
  const charL   = document.getElementById('charLeft');
  const charR   = document.getElementById('charRight');
  const line1   = document.getElementById('cutinLine1');
  const line2   = document.getElementById('cutinLine2');
  const pL      = document.getElementById('panelLeft');
  const pR      = document.getElementById('panelRight');

  // Reset
  overlay.className = 'active';
  panels.style.animation = 'none';
  pL.style.animation = 'none';
  pR.style.animation = 'none';
  line1.style.animation = 'none';
  line2.style.animation = 'none';
  document.getElementById('cutinText').style.animation = 'none';
  void overlay.offsetWidth;

  if(type==='super'){
    overlay.classList.add('cutin-super'); overlay.classList.remove('cutin-normal','cutin-keeper');
    pL.style.background = 'linear-gradient(135deg,#001a5e,#003087)';
    pR.style.background = 'linear-gradient(225deg,#001a5e,#003087)';
    charL.innerHTML = getShooterSVG(true);
    charR.innerHTML = '';
    charL.querySelector('svg').style.cssText = '--slide:-80px';
    charL.querySelector('svg').style.animation = 'charSlideIn 0.4s cubic-bezier(.2,.8,.3,1) both';
    line1.textContent = '⚡ SAMURAI BLUE ⚡';
    line2.textContent = 'SUPER SHOT!!';
    line1.style.color = 'var(--gold)';
    line2.style.color = '#fff';
    drawSpeedLines('rgba(245,200,66,0.3)');
  } else if(type==='normal'){
    overlay.classList.add('cutin-normal'); overlay.classList.remove('cutin-super','cutin-keeper');
    pL.style.background = 'linear-gradient(135deg,#001530,#002560)';
    pR.style.background = 'linear-gradient(225deg,#001530,#002560)';
    charL.innerHTML = getShooterSVG(false);
    charR.innerHTML = '';
    charL.querySelector('svg').style.cssText = '--slide:-60px';
    charL.querySelector('svg').style.animation = 'charSlideIn 0.35s cubic-bezier(.2,.8,.3,1) both';
    line1.textContent = 'JAPAN NO.10';
    line2.textContent = 'SHOOT!';
    line1.style.color = 'rgba(255,255,255,0.7)';
    line2.style.color = 'var(--gold)';
    drawSpeedLines('rgba(100,150,255,0.2)');
  } else { // keeper
    overlay.classList.add('cutin-keeper'); overlay.classList.remove('cutin-super','cutin-normal');
    pL.style.background = 'linear-gradient(135deg,#1a0000,#500010)';
    pR.style.background = 'linear-gradient(225deg,#1a0000,#500010)';
    charR.innerHTML = getKeeperSVG();
    charL.innerHTML = '';
    charR.querySelector('svg').style.cssText = '--slide:80px';
    charR.querySelector('svg').style.animation = 'charSlideIn 0.35s cubic-bezier(.2,.8,.3,1) both';
    line1.textContent = 'KEEPER BLOCKS!';
    line2.textContent = 'スーパーセーブ';
    line1.style.color = 'rgba(255,200,200,0.9)';
    line2.style.color = '#ff4466';
    drawSpeedLines('rgba(255,50,80,0.25)');
  }

  // Panel slide
  pL.style.animation = 'panelSlideLeft 0.35s cubic-bezier(.2,.8,.3,1) both';
  pR.style.animation = 'panelSlideRight 0.35s cubic-bezier(.2,.8,.3,1) both';
  document.getElementById('cutinText').style.animation = 'cutinText 0.4s 0.1s cubic-bezier(.2,.8,.3,1) both';

  const holdTime = type==='super' ? 1800 : 1200;
  setTimeout(()=>{
    overlay.style.transition = 'opacity 0.3s';
    overlay.style.opacity = '0';
    setTimeout(()=>{
      overlay.style.opacity = '1';
      overlay.style.transition = '';
      overlay.className = '';
      sCtx.clearRect(0,0,speedCanvas.width,speedCanvas.height);
      onDone();
    }, 300);
  }, holdTime);
}

// ===== GAME STATE =====
let shooting = false;
let swayTimer = null;

function startGame(){ showScreen('play'); resetGoalGrid(); }

function resetGoalGrid(){
  shooting = false;
  const gk = document.getElementById('gk');
  gk.style.transition = 'transform 0.15s ease';
  gk.style.transform = 'translateX(-50%)';
  const ball = document.getElementById('ball');
  ball.style.transition = 'none';
  ball.style.opacity = '0';
  ball.style.left = '50%'; ball.style.bottom = '1%';
  ball.style.transform = 'translateX(-50%) scale(1)';
  document.querySelectorAll('.zone').forEach(z=>{
    z.style.pointerEvents='all'; z.style.background='';
  });
  startGKSway();
}

function startGKSway(){
  clearInterval(swayTimer);
  let t=0;
  swayTimer = setInterval(()=>{
    if(shooting) return;
    t+=0.055;
    const x=Math.sin(t)*9;
    document.getElementById('gk').style.transform=`translateX(calc(-50% + ${x}px))`;
  },30);
}

function flash(){
  const el=document.getElementById('flash');
  el.style.opacity='1';
  setTimeout(()=>{ el.style.opacity='0'; },90);
}

function onZoneClick(zone){
  if(shooting) return;
  shooting = true;
  clearInterval(swayTimer);

  document.querySelectorAll('.zone').forEach(z=>z.style.pointerEvents='none');
  document.querySelector(`[data-zone="${zone}"]`).style.background='rgba(245,200,66,0.18)';

  const zInfo = ZONE_INFO[zone];

  // Decide: super shot (~35%), normal shot, or keeper cutin (on save)
  const isSuperShot = Math.random() < 0.35;

  let isGoal;
  if(isSuperShot){
    isGoal = Math.random() < 0.92; // almost always goal
  } else {
    isGoal = Math.random() < BASE_RATE[zone];
  }

  // Pick cut-in type
  // - super shot → show super cut-in
  // - normal shot + save → show keeper cut-in
  // - normal shot + goal → show normal shot cut-in
  let cutinType;
  if(isSuperShot){
    cutinType = 'super';
  } else if(!isGoal){
    cutinType = 'keeper';
  } else {
    cutinType = 'normal';
  }

  showCutin(cutinType, ()=>{
    executeShot(zone, isGoal, isSuperShot, zInfo);
  });
}

function executeShot(zone, isGoal, isSuperShot, zInfo){
  const wrap = document.getElementById('goalWrap');
  const wRect = wrap.getBoundingClientRect();
  const bt = BALL_TARGET[zone];
  const gd = GK_DIVE[zone];

  // Ball animate
  const ball = document.getElementById('ball');
  ball.style.opacity = '1';

  const duration = isSuperShot ? 0.38 : 0.55;
  setTimeout(()=>{
    ball.style.transition = `all ${duration}s cubic-bezier(0.15,0.85,0.25,1)`;
    ball.style.left = bt[0]+'%';
    ball.style.bottom = (100-bt[1])+'%';
    ball.style.transform = `translateX(-50%) scale(${isGoal?0.55:0.65})`;
  }, 40);

  // GK dive
  const gk = document.getElementById('gk');
  const diveDelay = isSuperShot ? 300 : (isGoal ? 100 : 60);
  setTimeout(()=>{
    gk.style.transition = `transform ${isSuperShot?0.6:0.4}s cubic-bezier(0.4,0,0.2,1)`;
    gk.style.transform = `translateX(calc(-50% + ${gd[0]}px)) translateY(${gd[1]}px) rotate(${gd[2]}deg)`;
  }, diveDelay);

  // Result
  const resultDelay = isSuperShot ? 550 : 750;
  setTimeout(()=>{
    flash();
    if(isGoal){
      const bx = wRect.left+(wRect.width*bt[0]/100);
      const by = wRect.top+(wRect.height*bt[1]/100);
      burst(bx,by, isSuperShot?'super':'goal');
    }
    setTimeout(()=>showResult(isGoal, isSuperShot, zone, zInfo), 350);
  }, resultDelay+duration*1000);
}

function showResult(isGoal, isSuperShot, zone, zInfo){
  const badge = document.getElementById('resultBadge');
  const superLabel = document.getElementById('superLabel');

  if(isGoal && isSuperShot){
    badge.textContent = 'GOAL!!';
    badge.className = 'result-badge supergoal';
    superLabel.className = 'super-label show';
  } else if(isGoal){
    badge.textContent = 'GOAL!';
    badge.className = 'result-badge goal';
    superLabel.className = 'super-label';
  } else {
    badge.textContent = isSuperShot ? 'SUPER SAVE...' : 'SAVE...';
    badge.className = 'result-badge save';
    superLabel.className = 'super-label';
  }

  const fortune = FORTUNES[zInfo.height][zInfo.dir][isGoal?'goal':'save'];
  document.getElementById('fortuneIcon').textContent = fortune.icon;
  document.getElementById('fortuneTheme').textContent = fortune.theme;
  document.getElementById('fortuneTitle').textContent = fortune.title;
  document.getElementById('fortuneText').textContent = fortune.text;
  document.getElementById('courseTag').textContent =
    `狙いコース：${zInfo.name}　|　${isSuperShot?'⚡スーパーシュート':'通常シュート'}　|　${isGoal?'成功':'惜しい！'}`;

  // Reset animations
  const card = document.getElementById('fortuneCard');
  [badge,card].forEach(el=>{ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; });

  showScreen('result');
}

function replay(){
  showScreen('play');
  setTimeout(resetGoalGrid,100);
}
