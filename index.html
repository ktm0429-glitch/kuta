<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMURAI BLUE PK CHALLENGE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#003087; --blue2:#0050c8;
  --gold:#f5c842; --gold2:#e8a000;
  --red:#e8003c;
}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:'Noto Sans JP',sans-serif;
  background:#000;color:#fff;user-select:none;
}

/* ===== BG ===== */
#bg{
  position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 120% 60% at 50% 110%,#1a3a6b 0%,#05101f 60%,#000 100%);
}
#bg::before{
  content:'';position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg,transparent 0,transparent 58px,rgba(255,255,255,0.02) 58px,rgba(255,255,255,0.02) 60px),
    repeating-linear-gradient(0deg,transparent 0,transparent 58px,rgba(255,255,255,0.02) 58px,rgba(255,255,255,0.02) 60px);
}
#bg::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 35% 25% at 8% 0%,rgba(200,220,255,0.12) 0%,transparent 60%),
    radial-gradient(ellipse 35% 25% at 92% 0%,rgba(200,220,255,0.12) 0%,transparent 60%);
}

/* ===== CROWD ===== */
#crowd{position:fixed;bottom:0;left:0;right:0;z-index:1;height:16vh;pointer-events:none;}
#crowd svg{width:100%;height:100%;}

/* ===== CANVASES ===== */
#particles{position:fixed;inset:0;z-index:5;pointer-events:none;}

/* ===== FLASH ===== */
#flash{position:fixed;inset:0;z-index:999;background:#fff;opacity:0;pointer-events:none;}

/* ===== SCREENS ===== */
.screen{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.5s ease;
}
.screen.active{opacity:1;pointer-events:all;}

/* ===== TITLE ===== */
#screen-title{gap:2vh;}
.title-badge{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(12px,1.8vw,18px);letter-spacing:0.5em;
  color:var(--gold);text-shadow:0 0 20px rgba(245,200,66,0.6);
}
.title-main{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(55px,11vw,130px);line-height:0.85;text-align:center;
  background:linear-gradient(180deg,#fff 0%,#7ab0ff 40%,#003087 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 30px rgba(0,80,200,0.8));
  animation:titlePulse 3s ease-in-out infinite;
}
.title-red{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(16px,2.8vw,34px);letter-spacing:0.3em;
  color:var(--red);text-shadow:0 0 20px rgba(232,0,60,0.8);
}
.tap-start{
  margin-top:3vh;
  padding:clamp(14px,2vh,22px) clamp(50px,8vw,90px);
  font-size:clamp(15px,2.2vw,24px);font-weight:900;letter-spacing:0.25em;
  color:#fff;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);
  border:2px solid rgba(120,160,255,0.5);border-radius:50px;cursor:pointer;
  box-shadow:0 0 30px rgba(0,80,200,0.5);
  animation:tapBlink 1.6s ease-in-out infinite;transition:all 0.3s;
}
.tap-start:hover{transform:scale(1.06);box-shadow:0 0 50px rgba(0,80,200,0.9);}

/* ===== PLAY SCREEN ===== */
#screen-play{gap:0;}
.play-header{text-align:center;margin-bottom:2vh;}
.play-header h2{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(22px,3.5vw,44px);letter-spacing:0.2em;
  color:var(--gold);text-shadow:0 0 20px rgba(245,200,66,0.6);
}
.play-header p{
  font-size:clamp(10px,1.4vw,14px);
  color:rgba(255,255,255,0.5);letter-spacing:0.15em;margin-top:4px;
}

/* Goal */
.goal-wrap{position:relative;width:min(82vw,720px);aspect-ratio:7/4.5;}
.goal-frame{
  position:absolute;inset:0;
  border:5px solid rgba(255,255,255,0.92);border-bottom:none;border-radius:4px 4px 0 0;
  box-shadow:0 0 50px rgba(255,255,255,0.06),inset 0 0 80px rgba(0,0,30,0.5);
  background:linear-gradient(180deg,rgba(0,20,60,0.4) 0%,rgba(0,40,10,0.2) 100%);
}
.goal-frame::before{
  content:'';position:absolute;top:-7px;left:-7px;right:-7px;height:14px;
  background:linear-gradient(to bottom,#e8e8e8,#aaa);border-radius:4px;
  box-shadow:0 4px 14px rgba(0,0,0,0.6);
}
.goal-frame::after{
  content:'';position:absolute;top:0;bottom:0;left:-8px;right:-8px;
  border-left:14px solid rgba(200,200,200,0.85);
  border-right:14px solid rgba(200,200,200,0.85);
  pointer-events:none;
}
.goal-net{
  position:absolute;inset:5px 5px 0;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,0.07) 0,rgba(255,255,255,0.07) 1px,transparent 1px,transparent 30px),
    repeating-linear-gradient(90deg,rgba(255,255,255,0.07) 0,rgba(255,255,255,0.07) 1px,transparent 1px,transparent 30px);
  pointer-events:none;
}

#gk{
  position:absolute;bottom:6%;left:50%;
  transform:translateX(-50%);
  width:13%;aspect-ratio:0.55/1;
  pointer-events:none;z-index:3;
}
#ball{
  position:absolute;width:6%;aspect-ratio:1;
  bottom:1%;left:50%;transform:translateX(-50%);
  pointer-events:none;z-index:4;opacity:0;
}

.goal-grid{
  position:absolute;inset:5px 12px 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:3px;z-index:5;
}
.zone{position:relative;cursor:pointer;border-radius:2px;overflow:hidden;}
.zone::before{
  content:'';position:absolute;inset:0;
  background:transparent;transition:all 0.2s;
}
.zone:hover::before{
  background:rgba(245,200,66,0.22);
  box-shadow:inset 0 0 25px rgba(245,200,66,0.25);
}
.zone-label{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(7px,1vw,12px);font-weight:700;
  color:rgba(255,255,255,0);transition:color 0.2s;letter-spacing:0.05em;
}
.zone:hover .zone-label{color:rgba(255,255,255,0.75);}

/* ===== CUT-IN ===== */
#cutin{
  position:fixed;inset:0;z-index:500;
  display:none;
  align-items:center;justify-content:center;
  overflow:hidden;
}
#cutin.show{display:flex;}

/* Speed lines canvas inside cutin */
#speedCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

/* BG color layer */
#cutinBg{
  position:absolute;inset:0;
  transition:none;
}

/* Left strip */
#cutinStripL{
  position:absolute;left:0;top:0;bottom:0;
  width:48%;
  display:flex;align-items:flex-end;justify-content:flex-end;
  overflow:hidden;
  transform:translateX(-100%);
}
/* Right strip */
#cutinStripR{
  position:absolute;right:0;top:0;bottom:0;
  width:48%;
  display:flex;align-items:flex-end;justify-content:flex-start;
  overflow:hidden;
  transform:translateX(100%);
}

#cutinStripL.slide{animation:slideInL 0.3s cubic-bezier(0.2,0.8,0.2,1) forwards;}
#cutinStripR.slide{animation:slideInR 0.3s cubic-bezier(0.2,0.8,0.2,1) forwards;}

.strip-char{height:88%;width:auto;display:block;}

/* Center divider line */
#cutinLine{
  position:absolute;left:50%;top:0;bottom:0;width:4px;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.9),transparent);
  transform:translateX(-50%) scaleY(0);
  transform-origin:center;
}
#cutinLine.pop{animation:linePop 0.15s 0.25s ease forwards;}

/* Big text */
#cutinMsg{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(0);
  text-align:center;white-space:nowrap;z-index:10;
}
#cutinMsg.pop{animation:msgPop 0.3s 0.28s cubic-bezier(0.2,0.8,0.2,1) forwards;}

#cutinSub{
  display:block;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(14px,2.5vw,30px);
  letter-spacing:0.4em;margin-bottom:4px;
}
#cutinMain{
  display:block;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(46px,9vw,110px);
  letter-spacing:0.06em;line-height:1;
  text-shadow:6px 6px 0 rgba(0,0,0,0.4);
}

/* Exit */
#cutin.exit{animation:cutinExit 0.25s ease forwards;}

/* ===== RESULT SCREEN ===== */
#screen-result{gap:2vh;padding:2vh;}
.result-badge{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(65px,14vw,170px);
  line-height:1;text-align:center;
  animation:resultPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both;
}
.result-badge.goal{
  background:linear-gradient(135deg,#fff 0%,var(--gold) 50%,#ff8800 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 35px rgba(255,150,0,0.9));
}
.result-badge.supergoal{
  background:linear-gradient(135deg,var(--gold) 0%,#fff 40%,var(--gold) 80%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 50px rgba(245,200,66,1));
  animation:resultPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both,superPulse 0.8s 0.5s ease-in-out infinite alternate;
}
.result-badge.save{
  background:linear-gradient(135deg,#888 0%,#fff 50%,#888 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.super-label{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(18px,3vw,36px);letter-spacing:0.4em;
  color:var(--gold);text-shadow:0 0 30px rgba(245,200,66,0.8);
  animation:cardSlide 0.4s 0.1s both;display:none;
}
.super-label.show{display:block;}
.fortune-card{
  width:min(92vw,620px);
  background:linear-gradient(135deg,rgba(0,10,30,0.96) 0%,rgba(0,30,70,0.96) 100%);
  border:1px solid rgba(120,160,255,0.35);border-radius:20px;
  padding:clamp(18px,3vw,38px);text-align:center;
  box-shadow:0 0 60px rgba(0,80,200,0.25),inset 0 1px 0 rgba(255,255,255,0.08);
  animation:cardSlide 0.6s 0.3s cubic-bezier(0.175,0.885,0.32,1.275) both;
  position:relative;overflow:hidden;
}
.fortune-card::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(0,80,200,0.06) 60deg,transparent 120deg);
  animation:spin 10s linear infinite;
}
.fortune-icon{font-size:clamp(28px,4.5vw,52px);margin-bottom:1vh;animation:iconBounce 0.8s 0.8s ease both;}
.fortune-theme{font-size:clamp(9px,1.3vw,13px);letter-spacing:0.35em;color:var(--gold);margin-bottom:0.8vh;}
.fortune-title{
  font-size:clamp(20px,3.2vw,40px);font-weight:900;margin-bottom:1.2vh;line-height:1.2;
  background:linear-gradient(135deg,#fff 0%,#7ab0ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.fortune-text{font-size:clamp(12px,1.6vw,17px);line-height:1.85;color:rgba(255,255,255,0.85);}
.course-tag{
  display:inline-block;margin-top:1.5vh;padding:5px 18px;
  border:1px solid rgba(120,160,255,0.4);border-radius:20px;
  font-size:clamp(9px,1.1vw,12px);color:rgba(120,160,255,0.85);letter-spacing:0.1em;
}
.replay-btn{
  margin-top:2vh;
  padding:clamp(12px,1.8vh,20px) clamp(40px,7vw,75px);
  font-size:clamp(14px,1.9vw,20px);font-weight:900;letter-spacing:0.2em;
  color:#fff;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);
  border:none;border-radius:50px;cursor:pointer;
  box-shadow:0 8px 30px rgba(0,80,200,0.5);
  transition:all 0.3s;animation:cardSlide 0.5s 0.6s both;
}
.replay-btn:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 12px 40px rgba(0,80,200,0.8);}

/* ===== KEYFRAMES ===== */
@keyframes titlePulse{0%,100%{filter:drop-shadow(0 0 20px rgba(0,80,200,0.6))}50%{filter:drop-shadow(0 0 50px rgba(0,80,200,1))}}
@keyframes tapBlink{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes resultPop{0%{transform:scale(0.2) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes superPulse{0%{filter:drop-shadow(0 0 30px rgba(245,200,66,0.8))}100%{filter:drop-shadow(0 0 70px rgba(245,200,66,1))}}
@keyframes cardSlide{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes iconBounce{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

@keyframes slideInL{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes slideInR{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes linePop{from{transform:translateX(-50%) scaleY(0)}to{transform:translateX(-50%) scaleY(1)}}
@keyframes msgPop{
  0%  {transform:translate(-50%,-50%) scale(3);opacity:0;}
  60% {transform:translate(-50%,-50%) scale(0.92);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
}
@keyframes cutinExit{
  0%  {opacity:1;transform:scale(1);}
  100%{opacity:0;transform:scale(1.06);}
}
@keyframes shakeX{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-12px)}
  40%{transform:translateX(12px)}
  60%{transform:translateX(-8px)}
  80%{transform:translateX(8px)}
}
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="particles"></canvas>
<div id="flash"></div>

<!-- Crowd -->

    <defs>
      <linearGradient id="cf" x1="0" y1="0" x2="0" y2="1">

      </linearGradient>

      <circle cx="700" cy="62" r="7"/><circle cx="770" cy="69" r="6"/><circle cx="840" cy="66" r="7"/>
      <circle cx="910" cy="72" r="6"/><circle cx="980" cy="66" r="7"/><circle cx="1050" cy="72" r="6"/>

      <circle cx="1330" cy="74" r="6"/>
    </g>
    <g opacity="0.35">
      <rect x="60" y="58" width="12" height="8" fill="white"/><circle cx="66" cy="62" r="2.5" fill="#BC002D"/>
      <rect x="340" y="54" width="12" height="8" fill="white"/><circle cx="346" cy="58" r="2.5" fill="#BC002D"/>

    </g>
    <rect x="0" y="0" width="1400" height="140" fill="url(#cf)"/>
  </svg>
</div>

<!-- ===== CUT-IN OVERLAY ===== -->
<div id="cutin">
  <canvas id="speedCanvas"></canvas>
  <div id="cutinBg"></div>
  <div id="cutinStripL"><svg id="charL" class="strip-char" viewBox="0 0 0 0"></svg></div>
  <div id="cutinStripR"><svg id="charR" class="strip-char" viewBox="0 0 0 0"></svg></div>
  <div id="cutinLine"></div>
  <div id="cutinMsg">
    <span id="cutinSub"></span>
    <span id="cutinMain"></span>
  </div>
</div>

<!-- TITLE -->
<div id="screen-title" class="screen active">
  <div class="title-badge">⚽ SAMURAI BLUE PRESENTS ⚽</div>
  <div class="title-main">PK<br>CHALLENGE</div>
  <div class="title-red">JAPAN NATIONAL TEAM</div>
  <button class="tap-start" onclick="startGame()">⚽ TAP TO START</button>
</div>

<!-- PLAY -->
<div id="screen-play" class="screen">
  <div class="play-header">
    <h2>コースを選べ！</h2>
    <p>9つのゾーンから狙いを定めよ — SAMURAI BLUE</p>
  </div>
  <div class="goal-wrap" id="goalWrap">
    <div class="goal-frame">
      <div class="goal-net"></div>
      <div id="gk">
        <svg viewBox="0 0 70 130" xmlns="http://www.w3.org/2000/svg">
          <rect x="16" y="48" width="38" height="48" rx="7" fill="#FF6B00"/>
          <rect x="22" y="48" width="26" height="8" fill="#cc5500"/>

          <rect x="2" y="54" width="16" height="9" rx="4" fill="#FF6B00"/>

          <rect x="17" y="94" width="16" height="26" rx="4" fill="#001f5e"/>

          <rect x="17" y="115" width="16" height="10" rx="2" fill="#fff"/>
          <rect x="37" y="115" width="16" height="10" rx="2" fill="#fff"/>
          <ellipse cx="25" cy="126" rx="12" ry="5" fill="#111"/>
          <ellipse cx="45" cy="126" rx="12" ry="5" fill="#111"/>
        </svg>
      </div>
      <div id="ball">
        <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
          <circle cx="30" cy="30" r="29" fill="white" stroke="#ccc" stroke-width="1"/>
          <path d="M30,3 L38.5,17 L27,17Z M30,3 L21.5,17 L27,17Z" fill="#111"/>
          <path d="M55,22 L43,27 L45,37Z" fill="#111"/>
          <path d="M5,22 L17,27 L15,37Z" fill="#111"/>
          <path d="M45,50 L38.5,38 L27,38Z" fill="#111"/>
          <path d="M15,50 L21.5,38 L27,38Z" fill="#111"/>
          <path d="M27,17 L38.5,17 L43,27 L38.5,38 L27,38 L21.5,38 L17,27Z" fill="#222"/>
        </svg>
      </div>
    </div>
    <div class="goal-grid" id="goalGrid">
      <div class="zone" data-zone="0" onclick="onZoneClick(0)"><div class="zone-label">左上</div></div>
      <div class="zone" data-zone="1" onclick="onZoneClick(1)"><div class="zone-label">上中</div></div>
      <div class="zone" data-zone="2" onclick="onZoneClick(2)"><div class="zone-label">右上</div></div>

// ===== PARTICLES =====
const pCanvas=document.getElementById('particles');
const pCtx=pCanvas.getContext('2d');
let particles=[];
function resizeP(){pCanvas.width=innerWidth;pCanvas.height=innerHeight;}
resizeP();window.addEventListener('resize',resizeP);

class Particle{
  constructor(x,y,type){
    this.x=x;this.y=y;this.type=type;
    if(type==='goal'||type==='super'){
      const pw=type==='super'?1.8:1;
      this.vx=(Math.random()-0.5)*20*pw;
      this.vy=(Math.random()-0.5)*18*pw-9*pw;
      this.size=Math.random()*11*pw+3;
      this.color=type==='super'
        ?['#f5c842','#fff','#ffcc00','#ffe566','#ff8800'][Math.floor(Math.random()*5)]
        :['#f5c842','#ff6600','#fff','#ff4444','#44ffaa'][Math.floor(Math.random()*5)];
      this.life=1;this.decay=Math.random()*0.012+0.008;
      this.gravity=0.35;this.shape=Math.random()>0.5?'c':'r';
      this.rot=Math.random()*Math.PI*2;this.rs=(Math.random()-0.5)*0.25;
    }else{
      this.vx=(Math.random()-0.5)*0.4;this.vy=-Math.random()*0.4-0.1;
      this.size=Math.random()*1.5+0.5;
      this.color=`rgba(0,80,200,${Math.random()*0.15+0.05})`;
      this.life=1;this.decay=Math.random()*0.002+0.001;
    }
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;
    if(this.type==='goal'||this.type==='super'){this.vy+=this.gravity;this.vx*=0.98;this.rot+=this.rs;}
    this.life-=this.decay;
  }
  draw(){
    pCtx.save();pCtx.globalAlpha=Math.max(0,this.life);
    if(this.type==='goal'||this.type==='super'){
      pCtx.translate(this.x,this.y);pCtx.rotate(this.rot);pCtx.fillStyle=this.color;
      if(this.shape==='c'){pCtx.beginPath();pCtx.arc(0,0,this.size,0,Math.PI*2);pCtx.fill();}
      else{pCtx.fillRect(-this.size/2,-this.size/2,this.size,this.size*0.55);}
    }else{
      pCtx.fillStyle=this.color;pCtx.beginPath();pCtx.arc(this.x,this.y,this.size,0,Math.PI*2);pCtx.fill();
    }
    pCtx.restore();
  }
}
function burst(x,y,type='goal'){
  for(let i=0;i<(type==='super'?200:120);i++) particles.push(new Particle(x,y,type));
}
(function loop(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  if(Math.random()<0.2) particles.push(new Particle(Math.random()*pCanvas.width,pCanvas.height+5,'a'));
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(loop);
})();

function drawSpeedLines(col){
  sCtx.clearRect(0,0,sCanvas.width,sCanvas.height);
  const cx=sCanvas.width/2,cy=sCanvas.height/2;
  for(let i=0;i<90;i++){
    const a=(i/90)*Math.PI*2;
    const inner=Math.random()*60+40;
    const outer=Math.random()*700+350;
    sCtx.beginPath();
    sCtx.moveTo(cx+Math.cos(a)*inner,cy+Math.sin(a)*inner);
    sCtx.lineTo(cx+Math.cos(a)*outer,cy+Math.sin(a)*outer);
    sCtx.strokeStyle=col;
    sCtx.lineWidth=Math.random()*3+0.5;
    sCtx.stroke();
  }
}

function showCutin(type, onDone){
  const el    = document.getElementById('cutin');
  const bg    = document.getElementById('cutinBg');
  const stripL= document.getElementById('cutinStripL');
  const stripR= document.getElementById('cutinStripR');
  const charL = document.getElementById('charL');
  const charR = document.getElementById('charR');
  const line  = document.getElementById('cutinLine');
  const msg   = document.getElementById('cutinMsg');
  const sub   = document.getElementById('cutinSub');
  const main  = document.getElementById('cutinMain');

  // Reset animation classes
  [stripL,stripR,line,msg].forEach(e=>{
    e.classList.remove('slide','pop');
    void e.offsetWidth;
  });
  charL.innerHTML=''; charR.innerHTML='';
  el.classList.remove('exit');

  if(type==='super'){
    bg.style.background='linear-gradient(135deg,#000820 0%,#001a5e 50%,#000820 100%)';
    charL.outerHTML; // reset
    document.getElementById('charL').outerHTML = document.getElementById('charL').outerHTML;
    // rebuild
    document.getElementById('cutinStripL').querySelector('svg').outerHTML;
    stripL.innerHTML = shooterSVG(true);
    stripL.querySelector('svg').className='strip-char';
    stripR.innerHTML = '';
    sub.textContent  = '⚡ SAMURAI BLUE ⚡';
    main.textContent = 'SUPER SHOT!!';
    sub.style.color  = '#f5c842';
    main.style.color = '#ffffff';
    main.style.textShadow = '0 0 40px #7ab0ff, 4px 4px 0 rgba(0,0,0,0.5)';
    drawSpeedLines('rgba(245,200,66,0.28)');
  } else if(type==='normal'){
    bg.style.background='linear-gradient(135deg,#000c20 0%,#002060 50%,#000c20 100%)';
    stripL.innerHTML = shooterSVG(false);
    stripL.querySelector('svg').className='strip-char';
    stripR.innerHTML = '';
    sub.textContent  = 'JAPAN NO.10';
    main.textContent = 'SHOOT!';
    sub.style.color  = 'rgba(255,255,255,0.7)';
    main.style.color = '#f5c842';
    main.style.textShadow = '4px 4px 0 rgba(0,0,0,0.5)';
    drawSpeedLines('rgba(100,160,255,0.2)');
  } else {
    bg.style.background='linear-gradient(135deg,#150000 0%,#4a000e 50%,#150000 100%)';
    stripR.innerHTML = keeperSVG();
    stripR.querySelector('svg').className='strip-char';
    stripL.innerHTML = '';
    sub.textContent  = 'KEEPER BLOCKS!';
    main.textContent = 'スーパーセーブ';
    sub.style.color  = 'rgba(255,180,180,0.9)';
    main.style.color = '#ff4466';
    main.style.textShadow = '0 0 30px #ff4466, 4px 4px 0 rgba(0,0,0,0.5)';
    drawSpeedLines('rgba(255,50,80,0.22)');
  }

  el.classList.add('show');
  // trigger slide
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(stripL.children.length) stripL.classList.add('slide');
      if(stripR.children.length) stripR.classList.add('slide');
      line.classList.add('pop');
      msg.classList.add('pop');
    });
  });

  const hold = type==='super' ? 1800 : 1300;
  setTimeout(()=>{
    el.classList.add('exit');
    setTimeout(()=>{
      el.classList.remove('show','exit');
      sCtx.clearRect(0,0,sCanvas.width,sCanvas.height);
      onDone();
    }, 260);
  }, hold);
}

function resetGoalGrid(){
  shooting=false;
  const gk=document.getElementById('gk');

  gk.style.transform='translateX(-50%)';
  const ball=document.getElementById('ball');
  ball.style.transition='none';
  ball.style.opacity='0';
  ball.style.left='50%';ball.style.bottom='1%';
  ball.style.transform='translateX(-50%) scale(1)';
  document.querySelectorAll('.zone').forEach(z=>{z.style.pointerEvents='all';z.style.background='';});
  startSway();
}
function startSway(){
  clearInterval(swayTimer);let t=0;
  swayTimer=setInterval(()=>{
    if(shooting)return;
    t+=0.055;
    document.getElementById('gk').style.transform=`translateX(calc(-50% + ${Math.sin(t)*9}px))`;
  },30);
}
function doFlash(){
  const f=document.getElementById('flash');
  f.style.opacity='1';
  setTimeout(()=>{f.style.opacity='0';},90);
}

function onZoneClick(zone){
  if(shooting)return;
  shooting=true;
  clearInterval(swayTimer);
  document.querySelectorAll('.zone').forEach(z=>z.style.pointerEvents='none');
  document.querySelector(`[data-zone="${zone}"]`).style.background='rgba(245,200,66,0.18)';

  const isSuperShot = Math.random()<0.35;
  const isGoal = isSuperShot ? Math.random()<0.92 : Math.random()<BASE_RATE[zone];
  const cutinType = isSuperShot ? 'super' : (!isGoal ? 'keeper' : 'normal');

  showCutin(cutinType, ()=>executeShot(zone, isGoal, isSuperShot));
}

function executeShot(zone, isGoal, isSuperShot){
  const wrap=document.getElementById('goalWrap');
  const wr=wrap.getBoundingClientRect();
  const bt=BALL_TARGET[zone];
  const gd=GK_DIVE[zone];
  const ball=document.getElementById('ball');
  const gk=document.getElementById('gk');
  const dur=isSuperShot?0.36:0.52;

  ball.style.opacity='1';
  setTimeout(()=>{
    ball.style.transition=`all ${dur}s cubic-bezier(0.15,0.85,0.25,1)`;
    ball.style.left=bt[0]+'%';
    ball.style.bottom=(100-bt[1])+'%';
    ball.style.transform=`translateX(-50%) scale(${isGoal?0.55:0.65})`;
  },40);

  const diveDelay=isSuperShot?300:(isGoal?100:60);
  setTimeout(()=>{
    gk.style.transition=`transform ${isSuperShot?0.6:0.4}s cubic-bezier(0.4,0,0.2,1)`;
    gk.style.transform=`translateX(calc(-50% + ${gd[0]}px)) translateY(${gd[1]}px) rotate(${gd[2]}deg)`;
    if(!isGoal) setTimeout(()=>{
      gk.style.animation='shakeX 0.3s ease';
      setTimeout(()=>{gk.style.animation='';},300);
    },500);
  }, diveDelay);

  setTimeout(()=>{
    doFlash();
    if(isGoal){
      burst(wr.left+wr.width*bt[0]/100, wr.top+wr.height*bt[1]/100, isSuperShot?'super':'goal');
    }
    setTimeout(()=>showResult(isGoal,isSuperShot,zone),350);
  }, diveDelay+dur*1000+300);
}

function showResult(isGoal,isSuperShot,zone){
  const zi=ZONE_INFO[zone];
  const badge=document.getElementById('resultBadge');
  const sl=document.getElementById('superLabel');

  badge.style.animation='none';void badge.offsetWidth;
  document.getElementById('fortuneCard').style.animation='none';
  void document.getElementById('fortuneCard').offsetWidth;
  document.getElementById('fortuneCard').style.animation='';

  if(isGoal&&isSuperShot){badge.textContent='GOAL!!';badge.className='result-badge supergoal';sl.className='super-label show';}
  else if(isGoal){badge.textContent='GOAL!';badge.className='result-badge goal';sl.className='super-label';}
  else{badge.textContent=isSuperShot?'SUPER SAVE...':'SAVE...';badge.className='result-badge save';sl.className='super-label';}
  badge.style.animation='';

  const f=FORTUNES[zi.height][zi.dir][isGoal?'goal':'save'];
  document.getElementById('fortuneIcon').textContent=f.icon;
  document.getElementById('fortuneTheme').textContent=f.theme;
  document.getElementById('fortuneTitle').textContent=f.title;
  document.getElementById('fortuneText').textContent=f.text;
  document.getElementById('courseTag').textContent=
    `狙い：${zi.name}　|　${isSuperShot?'⚡スーパーシュート':'通常シュート'}　|　${isGoal?'成功':'惜しい！'}`;

  showScreen('result');
}

function replay(){showScreen('play');setTimeout(resetGoalGrid,100);}
</script>
