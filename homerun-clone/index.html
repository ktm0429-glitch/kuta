<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ホームラン競争（オリジナル実装版）</title>
<style>
  :root{ color-scheme: light dark; }
  html,body{
    margin:0;padding:0;background:#20242b;color:#eee;
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;
  }
  h1{font-size:1.05rem;margin:16px 0 6px;font-weight:600;}
  #wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;}
  #field{background:#111;touch-action:none;max-width:100%;height:auto;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.4);}
  #controls{display:flex;gap:10px;}
  button{font-size:15px;padding:9px 18px;border-radius:8px;border:none;background:#2f9e5c;color:#fff;cursor:pointer;}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.5;cursor:default;}
  #boxBtn{background:#3a6ea5;}
  #howto{max-width:640px;text-align:center;font-size:.85rem;line-height:1.6;opacity:.9;}
  .note{font-size:.68rem;opacity:.55;max-width:640px;text-align:center;}
</style>
</head>
<body>
<h1>ホームラン競争（クローン・オリジナル実装）</h1>
<div id="wrap">
  <canvas id="field" width="700" height="420"></canvas>
  <div id="controls">
    <button id="startBtn">試合開始</button>
    <button id="boxBtn">打席チェンジ（左⇄右）</button>
  </div>
  <div id="howto">
    盤面をドラッグしてバットの位置（横方向）を合わせよう。指/クリックを離すとスイング！<br>
    球種はランダム（ストレート・カーブ・シュート）。芯を外さずタイミングよく振れば長打に。10球勝負でホームラン数を競おう。
  </div>
  <div class="note">※本ページはゲームの仕組み（変化球・ミート判定・遠近法によるフェンス判定など）を独自コードで再実装したオリジナル素材版のミニゲームです。実在の画像・音声・キャラクター意匠は使用していません（キャラクターは顔なしの簡易図形、効果音・BGMなし）。</div>
</div>
<script>
(function(){
"use strict";
const cvs = document.getElementById('field');
const ctx = cvs.getContext('2d');
const W = 700, H = 420;

const startBtn = document.getElementById('startBtn');
const boxBtn = document.getElementById('boxBtn');

// ---------------- constants ----------------
const MAX_BALLS = 10;
const FIRST_Y = 98, LASTPOS = 430, DISTANCE_Y = 120; // pitch travel geometry
const PLATE_X = 350;
const CONTACT_Y_MIN = 230, CONTACT_Y_MAX = 390;
const CONTACT_MAX_DIST = 150;
const BAT_Y = 300;
const BAT_RANGE = 40;
const WINDUP_MS = 900;
const FOLLOW_MS = 450;

// ---------------- mutable state ----------------
let box = 1;                // 1 = left box, 2 = right box
let ballCount = 0, homerunCount = 0, perfect = false;
let phase = 'IDLE';         // IDLE, WINDUP, PITCH, RISE, FIELD, HR_BANNER, GAMEOVER
let clock = 0;               // phase-local ms clock
let pitchElapsed = 0;        // ms since this pitch's windup began (drives pitcher pose)
let swingElapsed = 99999;    // ms since last swing (drives batter pose)

let now_mouse_x = W/2, initial_mouse_x = W/2;

const ball = { x:0, y:0, lastX:0, lastY:0, show:false };
let pitchSpeed = 0, pitchType = 0;
let dirBase = '', dir2 = '';
let kaku_h = 0, kaku_h_save = 0, hitPower = 0, vrd = 0;
const flight = { count:0, shadeX:0, shadeY:0, ballX:0, ballY:0 };
let hrBanner = null;

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function deg2rad(d){ return d*Math.PI/180; }

function batContactX(){
  const x = PLATE_X + (now_mouse_x - initial_mouse_x)/2;
  return clamp(x, PLATE_X-BAT_RANGE, PLATE_X+BAT_RANGE);
}

// ---------------- input ----------------
function canvasX(clientX){
  const r = cvs.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
cvs.addEventListener('pointerdown', e=>{
  const x = canvasX(e.clientX);
  initial_mouse_x = x;
  now_mouse_x = x;
  e.preventDefault();
});
cvs.addEventListener('pointermove', e=>{
  now_mouse_x = canvasX(e.clientX);
});
cvs.addEventListener('pointerup', ()=>{ trySwing(); });
cvs.addEventListener('pointercancel', ()=>{ trySwing(); });

startBtn.addEventListener('click', startGame);
boxBtn.addEventListener('click', ()=>{ box = (box===1) ? 2 : 1; });

// ---------------- game flow ----------------
function startGame(){
  ballCount = 0; homerunCount = 0; perfect = false;
  initial_mouse_x = now_mouse_x;
  startBtn.disabled = true;
  nextBall();
}

function nextBall(){
  if(ballCount >= MAX_BALLS){
    phase = 'GAMEOVER';
    startBtn.disabled = false;
    return;
  }
  ballCount++;
  dirBase = ''; dir2 = '';
  ball.show = false;
  phase = 'WINDUP';
  clock = 0;
  pitchElapsed = 0;
}

function startPitch(){
  pitchSpeed = Math.floor(Math.random()*10) + 10;      // 10-19 px / 80ms-tick
  pitchType  = Math.floor(Math.random()*3);            // 0 straight, 1 curve, 2 shoot
  ball.x = PLATE_X; ball.y = FIRST_Y; ball.lastX = ball.x; ball.lastY = ball.y;
  ball.show = true;
  phase = 'PITCH';
  clock = 0;
}

function trySwing(){
  swingElapsed = 0;
  if(phase !== 'PITCH' || !ball.show) return;

  const bx = batContactX(), by = BAT_Y;
  const dist = Math.hypot(ball.x-bx, ball.y-by);
  if(ball.y < CONTACT_Y_MIN || ball.y > CONTACT_Y_MAX || dist > CONTACT_MAX_DIST) return;

  const rote1 = Math.atan2(ball.y-ball.lastY, ball.lastX-ball.x) * 180/Math.PI;
  const rote2 = Math.atan2(by-ball.y, Math.abs(ball.x-bx)) * 180/Math.PI;
  let rote4 = 180 - rote1 - 2*rote2;
  if(box === 2) rote4 = 180 - rote1 + 2*rote2;

  let d = '';
  if(rote4 > 0 && rote4 <= 70){
    d = 'R'; kaku_h = 20*((rote4-0)/70) + 10;
  } else if(rote4 >= 110 && rote4 < 180){
    d = 'L'; kaku_h = 20*((180-rote4)/80) + 10;
  } else if(rote4 > 70 && rote4 < 110){
    d = 'C'; kaku_h = 30*((rote4-90)/20) + 90; kaku_h_save = kaku_h;
  } else {
    return; // 芯を外した角度: 空振り扱い
  }

  const sure = 30 * (1 - dist/CONTACT_MAX_DIST);
  hitPower = 50 * (sure/30) + 65;
  vrd = Math.floor(Math.random()*10) + 50;

  dirBase = d;
  ball.show = false;
  phase = 'RISE';
  clock = 0;
}

// ---------------- updaters ----------------
function updateWindup(dt){
  clock += dt; pitchElapsed += dt;
  if(clock >= WINDUP_MS) startPitch();
}

function updatePitch(dt){
  pitchElapsed += dt;
  const ticks = dt/80;
  ball.lastX = ball.x; ball.lastY = ball.y;

  if(pitchType === 1 && ball.y > DISTANCE_Y){
    ball.x += 3*Math.random()*ticks;           // カーブ
  } else if(pitchType === 2 && ball.y > DISTANCE_Y){
    ball.x -= 3*Math.random()*ticks;           // シュート
  } else {
    ball.x += 3*Math.random()*ticks;           // ストレート／変化前
  }

  if(box === 1 && ball.x > 400) ball.x = 400;
  if(box === 2 && ball.x < 300) ball.x = 300;

  ball.y += pitchSpeed*ticks;

  if(ball.y >= LASTPOS){
    ball.show = false;
    nextBall();
  }
}

function updateRise(dt){
  clock += dt; pitchElapsed += dt;
  const ticks = dt/80;
  let dx;
  if(dirBase === 'R') dx = (60-kaku_h)*ticks;
  else if(dirBase === 'L') dx = -(60-kaku_h)*ticks;
  else dx = (90-kaku_h)*ticks;
  ball.x += dx;
  ball.y -= 60*ticks;

  if(ball.y < 0){
    dir2 = dirBase + '2';
    flight.count = 0;
    phase = 'FIELD';
    clock = 0;
  }
}

function updateField(dt){
  const ticks = dt/80;
  flight.count += 0.3*ticks;

  const spd = hitPower*flight.count;
  const radV = deg2rad(vrd);
  const radH = deg2rad(kaku_h);
  const g = (9.8*flight.count*flight.count)/2;
  const realZ = spd*Math.sin(radV) - g;
  const realD = spd*Math.cos(radV);
  const realY = realD*Math.sin(radH);
  const realX = realD*Math.cos(radH);

  let eyeX, eyeY, eyeZ, offsetX=0, offsetY=0;
  if(dir2 === 'C2'){
    eyeX=300; eyeY=0; eyeZ=600;
    offsetX = -(W/2) - (kaku_h_save-90)*4;
    offsetY = 140;
  } else {
    eyeX=300; eyeY=420; eyeZ=500;
  }

  const denom = Math.max(1, eyeX+realX);
  let shadeX = W - (eyeX*((realY-eyeY)/denom) + eyeY) + offsetX;
  let shadeY = H - (eyeZ/denom)*realX + offsetY;
  if(dir2 === 'L2') shadeX = W - shadeX;

  flight.shadeX = shadeX; flight.shadeY = shadeY;
  flight.ballX = shadeX;  flight.ballY = H - realZ - 20;
  flight.realZ = realZ;

  if(flight.count < 1.0) return; // 発射直後の誤判定防止

  let atFence=false, isHR=false, wallPlus=0;
  if(dir2 === 'L2'){
    if(shadeX >= 260 && shadeY <= 260){
      atFence = true;
      if(realZ > 190){ isHR=true; wallPlus=68; }
    }
  } else if(dir2 === 'R2'){
    if(shadeX <= 436 && shadeY <= 260){
      atFence = true;
      if(realZ > 190){ isHR=true; wallPlus=68; }
    }
  } else {
    const cx=350, cy=1036, cr=2100;
    const under = cr*cr - (shadeX-cx)*(shadeX-cx);
    const yy = cy - Math.sqrt(Math.max(0,under)) + 1260;
    if(shadeY < yy){
      atFence = true;
      if(realZ > 190+66){ isHR=true; wallPlus=70; }
    }
  }

  if(atFence && !isHR){ nextBall(); return; }
  if(isHR) flight.shadeY -= wallPlus;

  if(flight.shadeY - flight.ballY <= 10){
    if(isHR) triggerHomerun(); else nextBall();
  }
}

function triggerHomerun(){
  homerunCount++;
  phase = 'HR_BANNER';
  clock = 0;
  hrBanner = { lineH:0, lineW2:0, textH:0, wait:0, shownPerfect:false };
}

function updateHrBanner(dt){
  const ticks = dt/80;
  const b = hrBanner;
  if(b.lineH < 200){ b.lineH = Math.min(200, b.lineH + 30*ticks); return; }
  if(b.lineW2 < 580){ b.lineW2 = Math.min(580, b.lineW2 + 50*ticks); return; }
  if(b.textH < 70){ b.textH = Math.min(70, b.textH + 4*ticks); return; }

  b.wait += ticks;
  if(b.wait > 40){
    if(homerunCount === 10 && !perfect){
      perfect = true;
      if(b.wait < 140) return;
    }
    nextBall();
  }
}

let lastT = null;
function update(dt){
  switch(phase){
    case 'WINDUP': updateWindup(dt); break;
    case 'PITCH': updatePitch(dt); break;
    case 'RISE': updateRise(dt); break;
    case 'FIELD': updateField(dt); break;
    case 'HR_BANNER': updateHrBanner(dt); break;
    default: break;
  }
  swingElapsed += dt;
}

// ---------------- rendering helpers (no faces, no images) ----------------
function drawSky(y0,y1){
  const g = ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,'#8fd0ef');
  g.addColorStop(1,'#cdeeff');
  ctx.fillStyle = g;
  ctx.fillRect(0,y0,W,y1-y0);
}

function drawHomeScene(){
  ctx.clearRect(0,0,W,H);
  drawSky(0,150);
  // outfield grass
  ctx.fillStyle = '#3f9142';
  ctx.fillRect(0,150,W,110);
  // fence line
  ctx.strokeStyle = '#245a27';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0,178); ctx.lineTo(W,178); ctx.stroke();
  // infield grass
  ctx.fillStyle = '#4caf50';
  ctx.fillRect(0,260,W,H-260);
  // infield dirt (diamond wedge)
  ctx.fillStyle = '#c9915a';
  ctx.beginPath();
  ctx.moveTo(PLATE_X,H-15);
  ctx.lineTo(150,260);
  ctx.lineTo(550,260);
  ctx.closePath();
  ctx.fill();
  // foul lines
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(PLATE_X,H-15); ctx.lineTo(60,178);
  ctx.moveTo(PLATE_X,H-15); ctx.lineTo(640,178);
  ctx.stroke();
  // mound
  ctx.fillStyle = '#b98a55';
  ctx.beginPath(); ctx.ellipse(PLATE_X,150,26,10,0,0,Math.PI*2); ctx.fill();
  // home plate
  ctx.fillStyle = '#eee';
  ctx.beginPath();
  ctx.moveTo(PLATE_X-12,H-18); ctx.lineTo(PLATE_X+12,H-18);
  ctx.lineTo(PLATE_X+12,H-10); ctx.lineTo(PLATE_X,H-2); ctx.lineTo(PLATE_X-12,H-10);
  ctx.closePath(); ctx.fill();
}

// 顔なしキャラクター（頭は無地の円。目・口は一切描かない）
function drawFigure(x, y, scale, bodyColor, armAngleDeg, legSpread){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  // legs
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(-8-legSpread,44); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(8+legSpread,44); ctx.stroke();
  // body
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(-11,20); ctx.lineTo(11,20); ctx.lineTo(8,-16); ctx.lineTo(-8,-16);
  ctx.closePath(); ctx.fill();
  // arm (single stylised arm, angle drives throw/swing motion)
  ctx.strokeStyle = bodyColor; ctx.lineWidth = 7;
  const rad = deg2rad(armAngleDeg);
  ctx.beginPath();
  ctx.moveTo(4,-10);
  ctx.lineTo(4+Math.cos(rad)*26, -10+Math.sin(rad)*26);
  ctx.stroke();
  // head: 無地の円のみ（顔パーツなし）
  ctx.fillStyle = '#f2c79a';
  ctx.beginPath(); ctx.arc(0,-24,10,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPitcher(){
  const t = pitchElapsed;
  let arm = -60;
  if(t < WINDUP_MS){
    arm = -60 + (-40)*(t/WINDUP_MS); // 振りかぶり
  } else if(t < WINDUP_MS+120){
    arm = -100 + 160*((t-WINDUP_MS)/120); // リリース
  } else if(t < WINDUP_MS+120+FOLLOW_MS){
    arm = 60 + 40*((t-WINDUP_MS-120)/FOLLOW_MS); // フォロースルー
  } else {
    arm = 100;
  }
  drawFigure(PLATE_X, 128, 1.4, '#4a6fa5', arm, 4);
}

function drawBatter(){
  const bx = batContactX();
  const visX = (box===1) ? (bx - 55) : (bx + 55);
  const visY = 300;
  let arm = (box===1) ? -150 : -30;
  if(swingElapsed < 260){
    const p = swingElapsed/260;
    const start = (box===1) ? -150 : -30;
    const end   = (box===1) ? 40 : -220;
    arm = start + (end-start)*Math.sin(p*Math.PI*0.5);
  }
  drawFigure(visX, visY, 1.5, '#c0473a', arm, 6);

  // bat: from hand toward the current contact point (visualises the drag-to-aim mechanic)
  ctx.save();
  ctx.strokeStyle = '#8a5a2b';
  ctx.lineWidth = 5; ctx.lineCap='round';
  const handX = visX + Math.cos(deg2rad(arm))*1.5*26;
  const handY = visY-10 + Math.sin(deg2rad(arm))*1.5*26;
  ctx.beginPath();
  ctx.moveTo(handX,handY);
  ctx.lineTo(bx, BAT_Y);
  ctx.stroke();
  ctx.restore();
}

function drawBall(x,y,r){
  ctx.beginPath();
  ctx.fillStyle = '#fdfdfd';
  ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = Math.max(1,r*0.25);
  ctx.beginPath(); ctx.arc(x,y,r*0.6,0.3,2.2); ctx.stroke();
}

function drawHUD(){
  ctx.fillStyle = 'rgba(20,20,20,0.55)';
  ctx.fillRect(0,0,W,30);
  ctx.fillStyle = '#fff';
  ctx.font = "18px sans-serif";
  ctx.fillText("残り " + Math.max(0,MAX_BALLS-ballCount+1) + " 球", 12, 21);

  for(let i=0;i<Math.max(0,MAX_BALLS-ballCount+1);i++){
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.arc(230+i*15, 15, 5, 0, Math.PI*2); ctx.fill();
  }

  const label = "ホームラン " + homerunCount + " 本";
  const tw = ctx.measureText(label).width;
  ctx.fillText(label, W-20-tw, 21);
  for(let i=0;i<homerunCount;i++){
    ctx.beginPath();
    ctx.fillStyle = '#ffd54a';
    const px = W - 25 - tw - 15 - i*15;
    ctx.moveTo(px,10);
    for(let k=0;k<5;k++){
      const a = -Math.PI/2 + k*(Math.PI*2/5);
      const a2 = a + Math.PI/5;
      ctx.lineTo(px+Math.cos(a)*6, 15+Math.sin(a)*6);
      ctx.lineTo(px+Math.cos(a2)*3, 15+Math.sin(a2)*3);
    }
    ctx.closePath(); ctx.fill();
  }
}

function renderHomeLike(){
  drawHomeScene();
  drawPitcher();
  drawBatter();
  if(ball.show || phase==='RISE'){
    const r = 4 + 4*((ball.y-FIRST_Y)/(LASTPOS-FIRST_Y));
    drawBall(ball.x, ball.y, Math.max(3,r));
  }
  drawHUD();
}

function drawOutfieldBg(){
  ctx.clearRect(0,0,W,H);
  drawSky(0,180);
  const palette = { 'L2':'#3a8a41', 'C2':'#2f7d55', 'R2':'#3a8a41' }[dir2] || '#3a8a41';
  ctx.fillStyle = palette;
  ctx.fillRect(0,150,W,H-150);
  // fence
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(0,182);
  ctx.quadraticCurveTo(W/2, dir2==='C2'?150:170, W,182);
  ctx.stroke();
  // foul poles
  ctx.fillStyle = '#e6e6e6';
  ctx.fillRect(30,140,5,50);
  ctx.fillRect(W-35,140,5,50);
}

function renderField(){
  drawOutfieldBg();
  ctx.beginPath();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.ellipse(flight.shadeX, flight.shadeY, 6,3,0,0,Math.PI*2); ctx.fill();
  drawBall(flight.ballX, flight.ballY, 6);
  drawHUD();
}

function renderHrBanner(){
  drawOutfieldBg();
  const b = hrBanner;
  const lineW = 600;
  ctx.fillStyle = 'rgba(238,238,238,0.55)';
  ctx.fillRect(W/2-lineW/2, H/2-b.lineH/2, lineW, b.lineH);
  ctx.fillStyle = 'rgba(228,228,228,0.85)';
  ctx.fillRect(W/2-b.lineW2/2, H/2-90, b.lineW2, 180);

  const text = perfect ? 'パーフェクト！' : 'ホームラン！';
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = perfect ? '#ff5a00' : '#1a4fbf';
  const size = 10 + b.textH;
  ctx.font = "bold " + size + "px sans-serif";
  ctx.fillText(text, W/2, H/2);
  ctx.restore();
  drawHUD();
}

function renderGameOver(){
  drawHomeScene();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = "bold 30px sans-serif";
  ctx.fillText("ゲーム終了", W/2, H/2-30);
  ctx.font = "22px sans-serif";
  ctx.fillText("ホームラン " + homerunCount + " / " + MAX_BALLS + " 本", W/2, H/2+10);
  if(perfect){
    ctx.fillStyle = '#ffd54a';
    ctx.font = "bold 20px sans-serif";
    ctx.fillText("パーフェクト達成！", W/2, H/2+45);
  }
  ctx.textAlign = 'left';
}

function renderIdle(){
  drawHomeScene();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = "22px sans-serif";
  ctx.fillText("「試合開始」を押してね", W/2, H/2);
  ctx.textAlign = 'left';
}

function render(){
  switch(phase){
    case 'IDLE': renderIdle(); break;
    case 'WINDUP':
    case 'PITCH':
    case 'RISE': renderHomeLike(); break;
    case 'FIELD': renderField(); break;
    case 'HR_BANNER': renderHrBanner(); break;
    case 'GAMEOVER': renderGameOver(); break;
    default: renderIdle(); break;
  }
}

function loop(t){
  if(lastT===null) lastT = t;
  const dt = Math.min(50, t-lastT);
  lastT = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
