[project]
name = "xbot"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]
train = ["numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
